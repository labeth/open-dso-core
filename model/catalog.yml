schemaVersion: 2
catalog:
  systems:
  - id: SYS-INSTRUMENT
    name: instrument
    definition: 'An oscilloscope running open-dso-core: the core''s engine, user interface, analysis, remote programming
      and supervision over the board-support package of one scope.'
    aliases:
    - the instrument
  dataTerms:
  - id: TERM-RAW
    name: raw captured record
    aliases:
    - raw storage
    definition: 32-bit SRAM words contain CH1(t0),CH2(t0),CH1(t1),CH2(t1), oldest first; 1,048,576 samples/channel
      at full depth.
  - id: TERM-PRECISION
    name: precision q8.8 record
    aliases:
    - precision payloads
    definition: 32-bit words contain one unsigned Q8.8 sample/channel; 524,288 pairs at full depth; preserve all
      fractional bits.
  - id: TERM-FRAME
    name: published frame
    aliases:
    - display frame
    - measurement frame
    definition: Samples plus valid length, sample period, trigger position, filter bandwidth/guard and mode metadata.
  - id: TERM-SETTINGS
    name: instrument settings
    definition: Desired channel, trigger, timebase, precision and display state with staged bus actions.
  - id: TERM-BITSTREAM
    name: fpga image
    definition: Volatile configuration plus identity, capabilities and qualification evidence; not a generic interchangeable
      binary.
  - id: TERM-HEALTH
    name: health token
    aliases:
    - health-token
    definition: Advancing engine heartbeat with initial coherent-frame gate; quiet NORM differs from a wedge.
  - id: TERM-UPDATE
    name: update payload
    aliases:
    - slot update
    definition: Staged app/agent slot binary and checksum; checksum does not establish authenticity.

schemaVersion: 2
decisions:
- id: ADR-CORE-IS-THE-PRODUCT
  title: The core is the product; a scope repository is a board-support package
  status: accepted
  date: '2026-11-06'
  context: One open firmware is meant to run on several oscilloscope families (SDS1000CML+, SDS800X HD, DHO1000
    and later ones) with the same features, look and feel. The SDS1000CML+ firmware grew as one app, with the
    product (engine, UI model, rendering, web, SCPI, analysis) and the board (acquisition, front end, FPGA,
    display and panel devices) in one tree.
  decision: Share by default. open-dso-core holds everything that is not explicitly board-specific - the engine,
    the UI model, display rendering, the web server, API and client, the SCPI core, VXI-11, decode, analysis,
    measurement, sound, super-resolution, the design system, the supervisor, the diagnostics framework and the
    test environment. Each open-<model> repository implements the HAL for its board and holds its specs, profile,
    FPGA images, SCPI dialect tables, stick or installer and simulator device model. Code stays per scope only
    when an explicit need is written down.
  consequences:
  - A second scope gets every feature the first has, through the HAL, instead of a copy.
  - The core's interfaces must be drawn from more than one data path (raw records, played-back windows,
    hardware-drawn displays), so the HAL is designed against the SDS800X HD port as well as the CML.
  - Per-scope differences are data (profile, capabilities), not branches in core code.

- id: ADR-FOUR-REPOSITORIES
  title: One core repository and one repository per scope
  status: accepted
  date: '2026-11-06'
  context: Two of the scopes cannot be public yet, and each scope releases at its own pace.
  decision: open-dso-core, open-sds1000cml, open-sds800xhd, open-dho1000, and open-<model> for each new scope,
    all under labeth. Unpublished scopes stay private until they run on a unit and their specs pass review.
  consequences:
  - Scopes pin a core version; local work uses a go.work-style replace of a sibling checkout.
  - Core changes that break a scope are made together with that scope's change.

- id: ADR-PURE-SPLIT-FIRST
  title: The first migration is a pure split with no new functions
  status: accepted
  date: '2026-11-06'
  context: The SDS1000CML+ is released and in use. Moving code and adding features at once makes regressions
    impossible to attribute.
  decision: Moving code into the core changes where it lives, not what it does - same protocol, stick layout,
    settings format and behaviour, gated by the unit tests, the LCD goldens, the parity suites and the bench.
    Generalisation for other scopes follows as separate steps.
  consequences:
  - Tests that check core code against a scope's sources (RTL top-level simulations) find the scope checkout
    through testenv.ScopeDir.

- id: ADR-NO-AUTHENTICATION
  title: No authentication or security functions in the agent, web or SCPI interfaces
  status: accepted
  date: '2026-11-06'
  context: The update agent accepts commands on TCP 5900 without authentication, NATS credentials are optional,
    and the web server serves /debug/pprof. Keys, enrolment and authenticated RPC were weighed.
  decision: An explicit trade-off - the overhead is not wanted. The interfaces move into the core as they are;
    the instruments are meant for a trusted bench network.
  consequences:
  - Each scope's README states that the instrument belongs on a trusted network.

- id: ADR-APP-AND-AGENT-MODULES
  title: Each scope keeps its app and its update agent as two Go modules
  status: accepted
  date: '2026-11-06'
  context: The scope app uses only the Go standard library and the core; the update agent links NATS. The agent is
    the supervisor that rolls back a bad app and changes rarely.
  decision: app/ and ota/ stay separate modules in every scope repository, each pinning the same core version.
  consequences:
  - The app's dependency list and licence list stay short on a 128 MB unit.

- id: ADR-SHARED-DESIGN-SYSTEM
  title: One design system for every scope's web UI and display
  status: accepted
  date: '2026-11-06'
  context: The families should look and feel the same. The SDS1000CML+ already generated its web and LCD palettes
    from one tokens file.
  decision: open-dso-core/design holds the colour tokens (one source, generating the web's tokens.css and the
    displays' Tokens), the shared stylesheets and the 5x7 display font. open-dso-core/webclient holds the whole web
    client. A scope's display maps its colour names onto the tokens.
  consequences:
  - A palette or stylesheet change reaches every scope at once.

- id: ADR-SHARED-WEB-SERVER
  title: One web server and HTTP API for every scope
  status: accepted
  date: '2026-11-06'
  context: The web UI is the same on every scope, so the API it speaks should be too. The SDS1000CML+ server was
    CML-shaped (two channels, 8-bit codes, DAC codes, detent indexes).
  decision: open-dso-core/webserver serves the shared client over one API; a scope implements webserver.Scope
    (capabilities, status, frames, settings, and optional parts by typed accessor). The page reads a capabilities
    document (/api/caps) and adapts to the scope. Frames gain a self-describing v2 wire format; the v1 formats
    stay for one release. Steps are in WEB-API-DESIGN.md (M0-M10).
  consequences:
  - M0-M3 move the server without changing a byte the CML serves.

- id: ADR-REMOTE-SCOPE-NEUTRAL
  title: The phone remote is driven by the shared workspaces and sheets
  status: proposed
  date: '2026-11-06'
  context: The SDS1000CML+'s phone remote mirrors its LCD. Other scopes have other screens and touch.
  decision: Default taken without the owner - the remote is scope-neutral, built from the shared workspaces and
    sheets, so it looks the same on every scope.
  consequences:
  - To review with the owner; reversible by giving a scope its own remote layout.

- id: ADR-SHARED-SETTINGS-ROWS
  title: Every scope's display UI runs on the shared settings rows
  status: proposed
  date: '2026-11-06'
  context: The UI model (workspaces, sheets, settings semantics) drives both the LCD and the web on the SDS1000CML+.
  decision: Default taken without the owner - the UI model moves to the core with per-scope data, and every
    scope's on-device UI draws the same rows; only drawing and input differ per scope.
  consequences:
  - To review with the owner; reversible by letting a scope keep its own settings model.

- id: ADR-LIVE-PAGE-BUDGET
  title: The one-live-page limit becomes a per-scope budget
  status: proposed
  date: '2026-11-06'
  context: The SDS1000CML+ serves one live page at a time to protect its single core's CPU.
  decision: Default taken without the owner - the number of live pages is a profile budget; the CML keeps one.
  consequences:
  - To review with the owner.

- id: ADR-SCREEN-NATIVE-SIZE
  title: The device-screen view is served at each scope's native size
  status: proposed
  date: '2026-11-06'
  context: /api/screen.png returns the CML's 800x480 LCD.
  decision: Default taken without the owner - each scope serves its own native size; the page scales it.
  consequences:
  - To review with the owner.

- id: ADR-NO-SHARED-RTL-YET
  title: FPGA sources stay in the scope repositories until a second design uses them
  status: proposed
  date: '2026-11-06'
  context: The SDS1000CML+ RTL is mostly board-bound (GPMC, AD9288 lanes, interleave, panel scan). The SDS800X HD
    starts on its vendor PL design and the DHO's open RTL cannot be published.
  decision: Default taken - no RTL moves to the core until a second open FPGA design consumes it and passes timing.
    This is the one exception to share-by-default, for lack of a second consumer.
  consequences:
  - To review with the owner if a second open FPGA design starts.

- id: ADR-CORE-PUBLIC
  title: open-dso-core is public
  status: accepted
  date: '2026-11-06'
  context: The SDS1000CML+ repository is public and its CI must fetch the core. Everything in the core is MIT code
    that was already public in the SDS1000CML+ repository, or new design written for the family. Making it public
    needs the owner's action.
  decision: open-dso-core becomes public. Until then scope CI needs a DSO_CORE_TOKEN secret to fetch it.
  consequences:
  - Scope CI fetches the core without a token once public.
  - Nothing derived from vendor material may enter the core; scope-specific knowledge enters it only as
    spec-derived, scope-neutral code.

- id: ADR-HAL-CORE-OWNS-LOOP
  title: 'The core engine owns the acquisition loop'
  status: accepted
  date: '2026-11-06'
  context: 'share by default: scheduling, publish gate, pacing and governor are the product. Alternative: a board-owned loop that emits frames — lower CML risk, but every scope re-implements the gate'
  decision: 'The core engine owns the acquisition loop (§2.1 cycle); boards implement step interfaces, not their own loop'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family).'

- id: ADR-HAL-STAGE-AND-COMMIT
  title: 'HAL setters stage'
  status: accepted
  date: '2026-11-06'
  context: 'the CML writes plan and trigger in one struct; the DHO and SDS800X HD reprogram only while stopped; trigger levels depend on the vertical setting'
  decision: 'HAL setters stage; `Acquirer.Arm` is the one hardware commit, in the order FrontEnd → Plan → Trigger'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family).'

- id: ADR-HAL-FRAME-NOT-GENERIC
  title: '`sample.Frame` is not generic'
  status: accepted
  date: '2026-11-06'
  context: 'the CML frame carries u8 codes and Q8.8 words at once; a type parameter would thread through engine, UI, renderer and web. Alternative: `Frame[S]` per PROPOSAL §4.5'
  decision: '`sample.Frame` is not generic; a trace holds `Codes8` or `Codes16` (+ optional precision words) with a `CodeFormat`; kernels are generic internally and picked per frame'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family).'

- id: ADR-HAL-MULTI-WINDOW-READ
  title: '`Readout.Read` takes several windows and a segment range per call'
  status: accepted
  date: '2026-11-06'
  context: 'CML edge/view-detail reads, DHO main+zoom in one play'
  decision: '`Readout.Read` takes several windows and a segment range per call'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family).'

- id: ADR-HAL-VOLTS-AT-THE-BOUNDARY
  title: 'Controllers'
  status: accepted
  date: '2026-11-06'
  context: 'three scopes encode levels three ways (DAC code, record code, screen pixels)'
  decision: 'Controllers (UI model, SCPI, web, settings) speak volts and seconds; DAC codes, detent indexes and pixel levels exist only in the board; knob steps come from `LevelGrid`/`OffsetGrid`'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family).'

- id: ADR-HAL-SETTINGS-FORMAT-KEPT
  title: 'The CML settings file stays byte-identical'
  status: accepted
  date: '2026-11-06'
  context: 'pure split; a format change is a later, separate step'
  decision: 'The CML settings file stays byte-identical; its `level_code` is written by the board''s settings extension'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family).'

- id: ADR-HAL-REGISTER-PATH
  title: 'The CML''s register-path loop'
  status: proposed
  date: '2026-11-06'
  context: 'the device never runs it (`engine_loop.go:58`, `app/run.go:294`)'
  decision: 'The CML''s register-path loop (no SRAM, ~1.9k lines, test-only) stays in the CML board as test infrastructure and is not moved; retiring it needs the owner'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family). Needs the owner.'

- id: ADR-HAL-SERVICE-HOOK
  title: 'Boards get an owner `Service'
  status: accepted
  date: '2026-11-06'
  context: 'the CML key matrix and lamp word share the acquisition bus with the owner'
  decision: 'Boards get an owner `Service()` hook and a readout `yield` instead of their own goroutines touching the bus'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family).'

- id: ADR-HAL-IMAGES-AS-FEATURES
  title: 'FPGA images are selected by feature set with parts needed and reload cost'
  status: accepted
  date: '2026-11-06'
  context: 'CML has nine images; the SDS800X HD reload resets the PL'
  decision: 'FPGA images are selected by feature set with parts needed and reload cost; `Images` absent on the SDS800X HD stage 1'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family).'

- id: ADR-HAL-RENDER-METRICS
  title: 'The renderer becomes resolution-independent through a per-screen `Metrics` table'
  status: accepted
  date: '2026-11-06'
  context: '27 goldens must stay pixel-identical; the 5×7 bitmap font does not scale freely'
  decision: 'The renderer becomes resolution-independent through a per-screen `Metrics` table (the 800×480 table equals today''s constants) and a pixel-format `Canvas`, not continuous scaling'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family).'

- id: ADR-HAL-UI-OVER-HW-RENDERER
  title: 'On a scope with a hardware waveform renderer the core draws the UI into an alpha framebuffer and leaves `Renderer.Area'
  status: accepted
  date: '2026-11-06'
  context: 'SDS800X HD composes fb0 ARGB over the PL waveform plane (07 §3.2)'
  decision: 'On a scope with a hardware waveform renderer the core draws the UI into an alpha framebuffer and leaves `Renderer.Area()` transparent; waveforms follow `Renderer.Configure(View)`'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family).'

- id: ADR-HAL-WEB-ON-CORE
  title: '`webserver.Scope` is implemented once in core'
  status: accepted
  date: '2026-11-06'
  context: 'share by default; the CML `webscope` adapter is temporary until the engine moves'
  decision: '`webserver.Scope` is implemented once in core (`scopeweb`) over the engine, `uimodel` and the HAL; scope-only routes come from `Board.Extensions()`'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family).'

- id: ADR-HAL-SUPERVISOR-MODULE
  title: 'The supervisor'
  status: accepted
  date: '2026-11-06'
  context: 'the app module must not list NATS; `app/` and `ota/` stay two modules per scope'
  decision: 'The supervisor (agent, slots, RPC, otactl) and diagnostics framework move to core as a separate Go module (`open-dso-core/supervisor`) with NATS; boards implement `SupervisorBoard` and `Census` in their `ota/` module'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family).'

- id: ADR-HAL-SCPI-DIALECTS
  title: 'One core SCPI engine'
  status: accepted
  date: '2026-11-06'
  context: 'CML speaks the legacy Siglent headers, the SDS800X HD the current tree (`appendix/scpi-commands.tsv`)'
  decision: 'One core SCPI engine (parser, IEEE 488.2, state binding, waveform and measurement engines, VXI-11/raw/telnet transports); each scope supplies a dialect table and waveform format'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family).'

- id: ADR-HAL-INSTRUMENT-STATE
  title: 'A core `instrument` state model replaces `panel.Engine`, `scpi.Scope`, `settings.Engine` and `web.Scope` as the one place settings are written and staged'
  status: accepted
  date: '2026-11-06'
  context: 'four overlapping controller interfaces today (§1.4)'
  decision: 'A core `instrument` state model replaces `panel.Engine`, `scpi.Scope`, `settings.Engine` and `web.Scope` as the one place settings are written and staged'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family).'

- id: ADR-HAL-OPTIONAL-REFUSED
  title: 'A missing optional capability'
  status: accepted
  date: '2026-11-06'
  context: 'principle 6; the SDS800X HD lacks gap-free decode and stacking'
  decision: 'A missing optional capability (`Streamer` kind, `Stacker`, `Images`, `LogicProbe`) refuses every feature that needs it with the profile''s reason; the simulator does the same for parts it does not model'
  consequences:
  - 'Designed in HAL v1 (the HAL and move plan for the family).'

- id: ADR-HAL-NODE-CONFIG-FIELDS
  title: 'Trigger node configurations are typed TrigStage fields'
  status: accepted
  date: '2026-11-07'
  context: 'Pattern, video, gated and timeout triggers bent the protocol-only Proto field on the SDS800X HD.'
  decision: 'TrigStage gains Gate, Pattern, Video and Timeout; Proto carries only protocol, symbol, sequence and frame-start nodes. The doc maps all 14 trigger types.'
  consequences:
  - 'HAL v1.1, found by the SDS800X HD board layer and adopted by both scopes.'

- id: ADR-HAL-PROTO-CONFIGS
  title: 'Protocol trigger configurations live in hal/prototrig'
  status: accepted
  date: '2026-11-07'
  context: 'A board programming its matcher should not import a decoder.'
  decision: 'hal/prototrig holds I2C, SPI, UART, CAN and LIN trigger configurations; PatternState moves to hal.'
  consequences:
  - 'HAL v1.1, found by the SDS800X HD board layer and adopted by both scopes.'

- id: ADR-HAL-TRIGGER-DEFAULTS
  title: 'Boards give each trigger node''s defaults'
  status: accepted
  date: '2026-11-07'
  context: 'Default levels depend on the board (the SDS800X HD''s sync tip in pixels at the source''s V/div).'
  decision: 'Trigger.Default(node, src) returns a stage; the controller decides when a choice is the first one.'
  consequences:
  - 'HAL v1.1, found by the SDS800X HD board layer and adopted by both scopes.'

- id: ADR-HAL-STREAM-LAYOUT
  title: 'Multi-channel stream blocks are channel-major'
  status: accepted
  date: '2026-11-07'
  context: 'A block holding several channels needed one layout rule.'
  decision: 'Equal runs per channel in StreamSpec.Channels order; Held has one entry per sample time; StreamBlock.Run(i) returns one channel.'
  consequences:
  - 'HAL v1.1, found by the SDS800X HD board layer and adopted by both scopes.'

- id: ADR-HAL-STREAM-GOROUTINE
  title: 'A stream''s transfer goroutine may own the transfer path'
  status: accepted
  date: '2026-11-07'
  context: 'Roll mode on the SDS800X HD needs its DMA serviced off the owner loop.'
  decision: 'Between Start and Stop the stream goroutine owns the transfer path and nothing else; Arm and Read are refused; Stop returns after it lets go. Amends ADR-HAL-SERVICE-HOOK.'
  consequences:
  - 'HAL v1.1, found by the SDS800X HD board layer and adopted by both scopes.'

- id: ADR-HAL-PEAK-PAIRS
  title: 'Peak pairs are (min, max) unless Ordered'
  status: accepted
  date: '2026-11-07'
  context: 'The CML, the fake board and the SDS800X HD disagreed on order and counting.'
  decision: 'Pairs are (min, max) unless Ordered, set only when the hardware records which extreme came first; SampleS, TriggerAt and WinPoints count codes; merging keeps whole pairs, so compressing hardware reads peak windows uncompressed.'
  consequences:
  - 'HAL v1.1, found by the SDS800X HD board layer and adopted by both scopes.'

- id: ADR-HAL-RENDER-VIEW
  title: 'The renderer view has display modes and a zoom gain'
  status: accepted
  date: '2026-11-07'
  context: 'XY bool could not express YT+XY or split; the zoom view needed its gain.'
  decision: 'View.Mode (YT, XY, YT+XY, split) replaces XY; Gain is the zoom view''s vertical zoom; OffsetDiv is defined for both views; Held redraws the stored record at once or is refused.'
  consequences:
  - 'HAL v1.1, found by the SDS800X HD board layer and adopted by both scopes.'

- id: ADR-HAL-SELFCAL
  title: 'Self-calibration is a FrontEnd method'
  status: accepted
  date: '2026-11-07'
  context: 'The SDS800X HD ran self-cal as a board extension with its own state machine.'
  decision: 'FrontEnd.SelfCal(ctx, progress) (CalReport, error), LONG and OWNER; CalSource.Author is vendor, open or empty.'
  consequences:
  - 'HAL v1.1, found by the SDS800X HD board layer and adopted by both scopes.'

- id: ADR-HAL-EXTENSIONS-NO-HARDWARE
  title: 'Extension handlers never touch hardware'
  status: accepted
  date: '2026-11-07'
  context: 'Extension routes and SCPI headers run on server goroutines.'
  decision: 'Short work is queued for Platform.Service; long work is a HAL method the core schedules; SCPIHeader splits into Command and Query.'
  consequences:
  - 'HAL v1.1, found by the SDS800X HD board layer and adopted by both scopes.'

- id: ADR-HAL-SUPERVISOR-HEALTH
  title: 'A supervisor without a watchdog checks health'
  status: accepted
  date: '2026-11-07'
  context: 'The SDS800X HD has no hardware watchdog.'
  decision: 'Optional hal.HealthChecker (Healthy, Confirmed); SupervisorBoard.Reboot may be refused under a reboot policy.'
  consequences:
  - 'HAL v1.1, found by the SDS800X HD board layer and adopted by both scopes.'

- id: ADR-HAL-CENSUS-SUPERVISOR
  title: 'The census belongs to the supervisor board'
  status: accepted
  date: '2026-11-07'
  context: 'Board.Census made a scope''s app module require its ota module.'
  decision: 'Board.Census is removed; the optional hal.CensusBoard sits on the supervisor board. Amends ADR-HAL-SUPERVISOR-MODULE.'
  consequences:
  - 'HAL v1.1, found by the SDS800X HD board layer and adopted by both scopes.'

- id: ADR-HAL-PROFILE-ABSENT
  title: 'Profiles say why an optional part is absent'
  status: accepted
  date: '2026-11-07'
  context: 'Refusals for missing parts need a reason the profile can state.'
  decision: 'Profile.Absent maps each optional part to its reason, validated by profile.Validate.'
  consequences:
  - 'HAL v1.1, found by the SDS800X HD board layer and adopted by both scopes.'

- id: ADR-HAL-INPUT-BEEPER-TOUCH
  title: 'Input covers the beeper and the touch switch'
  status: accepted
  date: '2026-11-07'
  context: 'The SDS800X HD has a beeper and a touch panel the HAL could not reach.'
  decision: 'Input gains SetSound, Beep and SetTouch, refused where absent.'
  consequences:
  - 'HAL v1.1, found by the SDS800X HD board layer and adopted by both scopes.'

- id: ADR-RENDER-MAXCHANS
  title: The display HUD holds at most four channels
  status: proposed
  date: '2026-11-07'
  context: The renderer copies its HUD by value through every draw call; a fixed array keeps that cheap on a Cortex-A8.
  decision: render.MaxChans is 4, covering every scope in the family today.
  consequences:
  - An eight-channel scope would raise it, at the cost of a larger HUD copy per draw.

- id: ADR-CORE-MODEL-TIER
  title: The core's engineering model is held to the product life-cycle tier
  status: accepted
  date: '2026-11-07'
  context: The core is the product (ADR-CORE-IS-THE-PRODUCT); every scope's firmware composes it, and the
    SDS1000CML+ model it came from is held to the product tier. A system model at the product tier refuses a
    dependency below it.
  decision: 'The core model declares its life-cycle tier in engmod.yml and requirement links are strict.

    Tier: Product

    Bundles: Foundation, Security
    '
  consequences:
  - Every core requirement realizes a core capability (CAP-DSO-*) or is derived with a rationale, and is linked
    from the core's code; an untraced, unparented or unapproved requirement fails the model check.
  - A scope model at the product tier composes the core without accepting a below-tier risk.
  - The security bundle commits the core model to control, risk and trust-boundary records for the parts it
    holds (the web server, the remote interfaces and the supervisor).

- id: ADR-CORE-MODEL-IDS
  title: A requirement the core implements keeps its number under the REQ-DSO prefix
  status: accepted
  date: '2026-11-07'
  context: The code that moved from the SDS1000CML+ to the core kept its TRLC-LINKS to REQ-SDS-* requirements.
    The modelling engine resolves a TRLC-LINKS only against the model nearest the code, and assumes each model's
    requirement IDs are its own (a composed model sees another's only as alias::ID). Some requirements are
    implemented in the core alone, others partly in the core and partly in a scope.
  decision: Each model owns one prefix - REQ-DSO-* in the core, REQ-SDS-* in the SDS1000CML+, REQ-HD-* in the
    SDS800X HD. A requirement the core implements is REQ-DSO-NNN with the number of the REQ-SDS-NNN it came from,
    so the history maps one to one. A requirement only the core implements leaves the SDS1000CML+ model; one
    implemented on both sides stays there as REQ-SDS-NNN for the scope's part and is REQ-DSO-NNN for the core's.
    A requirement new to the core takes a number from 1001 up, which no scope model uses. Functional units are
    one per core package (FU-DSO-<PACKAGE>, FU-DSO-SUPERVISOR-<PACKAGE>) and the code names them in
    ENGMODEL-OWNER-UNIT; capabilities are CAP-DSO-<AREA>, after the SDS1000CML+ capability of the same area.
  consequences:
  - Code moving into the core changes its TRLC-LINKS from REQ-SDS-NNN to REQ-DSO-NNN and its owner unit to the
    core package's, and the core model gains REQ-DSO-NNN if it lacks it.
  - A scope model composes the core (alias core) and names core elements as core::ID.

- id: ADR-HAL-LOOP-CYCLE
  title: 'The core owns the acquisition pass'
  status: accepted
  date: '2026-11-07'
  context: 'Scopes ran their own owner loops; the CML''s runSRAM held product logic the SDS800X HD rewrote.'
  decision: 'The core engine.Loop owns the pass (commit points, arm, wait, AUTO force, publish gate, single shot, pacing); a scope supplies a Cycle that shrinks as its settings become HAL terms; HALCycle drives a board fully in HAL terms.'
  consequences:
  - 'From the owner-loop move (S7).'

- id: ADR-LOOP-ARM-EVERY-PASS
  title: 'The loop arms every pass and serves commit points inside the wait'
  status: accepted
  date: '2026-11-07'
  context: 'Settings changes must take effect without waiting for a slow trigger.'
  decision: 'Every pass arms; the wait serves commit points between polls and aborts on a settings change or pending work.'
  consequences:
  - 'From the owner-loop move (S7).'

- id: ADR-FORCE-PENDING-IS-THE-FRAMES
  title: 'A pending FORCE makes the ready frame user-forced'
  status: accepted
  date: '2026-11-07'
  context: 'A FORCE press can arrive as the record completes.'
  decision: 'A FORCE still pending when the record is ready marks that frame user-forced.'
  consequences:
  - 'From the owner-loop move (S7).'

- id: ADR-INSTRUMENT-REFUSAL-TO-SCPI
  title: 'Commit refusals reach the SCPI error queue'
  status: accepted
  date: '2026-11-07'
  context: 'A board refusing a setting at the owner commit was invisible to SCPI.'
  decision: 'instrument.Model.OnRefused feeds scpi.Engine.Report; a hal.Refusal becomes -221 with its text, other errors -200.'
  consequences:
  - 'From the owner-loop move (S7).'

- id: ADR-READ-CTX-AND-CUT
  title: 'Readout.Read takes a context and cuts detail windows'
  status: accepted
  date: '2026-11-07'
  context: 'A read must stop when its frame is no longer wanted.'
  decision: 'Read(ctx, ...); a detail window is cut to what it got; a short main window is an error.'
  consequences:
  - 'From the owner-loop move (S7).'

- id: ADR-CML-RUN-CONTROL-STAYS
  title: 'The CML''s run control stays outside the instrument state for now'
  status: proposed
  date: '2026-11-07'
  context: 'A mask stop can leave a SINGLE armed while stopped, and AUTO/NORM chosen during a SINGLE keeps it armed; Running and Sweep cannot express that.'
  decision: 'CML run control stays out of instrument.State until the UI model decides the run-control semantics.'
  consequences:
  - 'From the owner-loop move (S7).'
  - 'Superseded by ADR-RUN-CONTROL: the semantics are decided and the instrument state carries them.'

- id: ADR-UMBRELLA-REPO
  title: open-dso is the family's public front door and system model
  status: accepted
  date: '2026-11-07'
  context: Someone arriving at one scope repository saw a scope, not a family; the cross-cutting documentation (architecture, adding a scope, provenance, status) belonged to no single code repository.
  decision: labeth/open-dso is a public, docs-only repository with the family's README, its documentation and a system-of-systems engineering model that composes the public repositories' models (like atlas-industries' company-portfolio). It holds no code and copies no decision or specification; it links to the single sources.
  consequences:
  - Private scopes appear there as planned subsystems and join the family model when they become public.
  - A GitHub organisation (open-dso/...) remains a later option; it would change every Go module path.

- id: ADR-WEB-SCOPE-HOOKS
  title: 'scopeweb takes hooks for state the instrument model does not hold yet'
  status: accepted
  date: '2026-11-07'
  context: 'The CML''s status counters, v1 set switch, scales and leases live in its engine, not yet in the instrument model.'
  decision: 'scopeweb is one implementation over the board, the instrument model and the fan-out; Status, Controls, Scales, Quiet and Routes hooks stand in for state not yet in core, each naming what it replaces so it can go when that state moves.'
  consequences:
  - 'From the core web scope step (S8).'

- id: ADR-WEB-V2-ONLY-SERVES-V2
  title: 'A scope with only frame wire v2 answers every frame request in v2'
  status: accepted
  date: '2026-11-07'
  context: 'The page asks for its first frame before reading caps and reads a 409 as another page taking over.'
  decision: 'A v2-only scope serves v2 to every frame request; the page tells the wires apart by their first bytes. Departs from the design''s 409.'
  consequences:
  - 'From the core web scope step (S8).'

- id: ADR-HAL-PUBLISH-SEQ
  title: 'The HAL cycle numbers the frames it publishes'
  status: proposed
  date: '2026-11-07'
  context: 'The core HAL cycle published every frame with seq 0, so the fan-out never woke a waiting page; scopeweb numbers them meanwhile.'
  decision: 'The engine''s HAL cycle assigns the publish sequence.'
  consequences:
  - 'From the core web scope step (S8).'
  - 'HALCycle.Publish numbers frames from 1; the web scope uses the plain frame fan-out (fanout.NewFrames).'

- id: ADR-WEB-SETTINGS-ALIAS
  title: 'The server translates v1 setting names to v2'
  status: accepted
  date: '2026-11-07'
  context: 'Deployed pages and tools send vdiv1, offset2 and similar.'
  decision: 'The server maps the v1 per-channel names onto {control, ch, value} before the scope sees them.'
  consequences:
  - 'From the core web scope step (S8).'

- id: ADR-WEB-CAPS-OFF-CML-UNTIL-S9
  title: 'The CML serves no capabilities document until the UI model moves'
  status: accepted
  date: '2026-11-07'
  context: 'Serving caps puts api and caps_gen at the front of every status reply, changing the CML''s status bytes.'
  decision: 'The CML keeps caps off until the UI model step; other scopes serve caps.'
  consequences:
  - 'From the core web scope step (S8).'

- id: ADR-RUN-CONTROL
  title: 'Run control is three facts: running, the trigger mode and a single shot armed'
  status: proposed
  date: '2026-11-07'
  context: 'The SDS1000CML+ engine keeps running, NORM and a single shot as independent flags, with the mode a
    SINGLE replaced; Running plus one Sweep could not say that a mask stop leaves a shot armed or that AUTO picked
    during a shot keeps it armed.'
  decision: 'instrument.State has Running, Sweep (AUTO or NORMAL) and Single. SINGLE arms a shot in NORMAL and
    remembers the mode it replaced; the next RUN brings that mode back unless the user picked one meanwhile;
    AUTO or NORMAL picked during a shot keeps it armed and waiting in that mode; RUN and STOP cancel a shot; a
    failed mask test stops the run and leaves a shot armed; the shot''s triggered frame stops the run and spends
    it. A controller writing Sweep Single arms a shot. The CML''s engine keeps these rules in its own flags
    behind instrument.Controls until its owner stages through the Model.'
  consequences:
  - 'The behaviour every SDS1000CML+ user knows is the family''s; the SDS800X HD''s run keys follow it through
    the Model.'
  - 'BoardSweep gives a board the sweep to run: a shot armed in AUTO free-runs until a triggered frame.'
  - 'A second SINGLE while a shot is armed changes no state, so on a HAL scope it does not restart the capture.'

- id: ADR-ONE-CONTROLS-SURFACE
  title: 'Every controller drives one instrument.Controls surface'
  status: proposed
  date: '2026-11-07'
  context: 'The SDS1000CML+ had four overlapping controller interfaces over its engine (panel.Engine, scpi.Scope,
    settings.Engine, webscope.Engine), each a different slice of the same setters.'
  decision: 'instrument.Controls is the one settings surface with its Stats snapshot; the UI model, SCPI, the
    settings file and the web scope take it. *instrument.Model implements it for a HAL scope; the CML engine
    implements it over its own state. What a controller needs beyond it (the mask test, the lamp word, the
    acquisition log) stays a separate, named part.'
  consequences:
  - 'A test fake implements the whole surface once.'
  - 'The CML''s engine state moves into the Model later without changing a controller.'

- id: ADR-UI-KEYS-ARE-CORE-NAMES
  title: 'Boards decode input to the UI model''s key names'
  status: accepted
  date: '2026-11-07'
  context: 'The CML''s key chain and the SDS800X HD''s key matrix and touch panel differ.'
  decision: 'A board decodes its keys, knobs and touch to the UI model''s key names; lamps leave the UI model by name and the board maps them to its hardware.'
  consequences:
  - 'From the UI model step (S9).'

- id: ADR-LAMP-WORD-IS-WIRE
  title: 'The status lamp word keeps the CML latch layout'
  status: accepted
  date: '2026-11-07'
  context: 'Pages read the lamp word from the status document.'
  decision: 'The lamp word in the status keeps the SDS1000CML+ bit layout as a wire format; boards map named lamps onto their own hardware.'
  consequences:
  - 'From the UI model step (S9).'

- id: ADR-CML-CAPS-WIRE-V1
  title: 'The CML serves caps but keeps frame wire v1 for now'
  status: proposed
  date: '2026-11-07'
  context: 'With v2 frames listed, the first mask the page built from a v2 raw frame differed from the v1 one.'
  decision: 'The CML serves /api/caps with frame wire v1 only until the v2 mask difference is explained and an on-device A/B shows no cost.'
  consequences:
  - 'From the UI model step (S9).'

- id: ADR-UI-HARDWARE-FACTS
  title: 'The UI model plans with a board''s hardware facts, not its engine'
  status: accepted
  date: '2026-11-07'
  context: 'The panel used the CML engine''s ladders, DAC laws and SRAM plan directly.'
  decision: 'uimodel/panel plans with a board''s Hardware facts adapter; the engine stays behind instrument.Controls.'
  consequences:
  - 'From the UI model step (S9).'

- id: ADR-HAL-STAGED-PERSISTS
  title: 'What is staged stays staged; staging it again changes nothing'
  status: accepted
  date: '2026-11-07'
  context: 'The CML owner programs its trigger and configures its plan at every pass and at every look at the settings while a capture waits; replanning the fabric''s 2.7 KB configuration each time cost the Cortex-A8 4-5 points of CPU. HALCycle commits only on an instrument generation change.'
  decision: 'Acquirer.Configure and Trigger.Program stage until changed: a plain re-arm commits the staged state again, and a call with what is staged (at the same FrontEnd state) changes nothing and is no commit arm. A board knows a repeat cheaply (the CML keeps the spec and its inputs and composes once a change); an owner may stage every pass or only on a change.'
  consequences:
  - 'From the S7c CPU fix. The SDS800X HD board stages into its settings struct and commits only what differs, so it already holds.'

- id: ADR-ONE-SCOPEAPP
  title: 'A scope''s main is its board plus one scopeapp.Run call'
  status: accepted
  date: '2026-11-07'
  context: 'Each scope composed the engine, UI, display, SCPI, web and settings itself.'
  decision: 'open-dso-core/scopeapp.Run(ctx, board, Options) composes them in a fixed order; scope-specific pieces enter as options (dialect, extensions, a board''s own engine cycle, display device).'
  consequences:
  - 'From the composition and settings step (S11, S13).'

- id: ADR-ONE-DISPLAY-LOOP
  title: 'One display loop for every scope'
  status: accepted
  date: '2026-11-07'
  context: 'The CML had its LCD loop (52 Hz cadence, CPU-aware governor, saver, busy mode) and the SDS800X HD a separate 20 Hz loop.'
  decision: 'The CML''s loop moved into the core unchanged and drives every scope''s framebuffer; the screen saver and backlight come with it.'
  consequences:
  - 'From the composition and settings step (S11, S13).'

- id: ADR-SETTINGS-KV
  title: 'Settings persist through the core over a board''s key-value store, new fields only when non-zero'
  status: accepted
  date: '2026-11-07'
  context: 'The CML''s settings file must stay byte-identical while other scopes add fields (C3/C4, levels in volts, math/X-Y pairs).'
  decision: 'Core settings load, save, collect and apply over instrument.Controls into a board''s store; fields a two-channel CML never sets are written only when non-zero, so its file does not move.'
  consequences:
  - 'From the composition and settings step (S11, S13).'

- id: ADR-SAVER-PRIMED-AT-RESTORE
  title: 'The settings saver is primed at restore'
  status: accepted
  date: '2026-11-07'
  context: 'The saver used its first poll as its baseline, so a change in the first second after start was never saved.'
  decision: 'The saver takes the restored settings as its baseline.'
  consequences:
  - 'From the composition and settings step (S11, S13).'

- id: ADR-ONE-SETUP-MEMORY
  title: 'Panel, SCPI and web share one setup memory'
  status: accepted
  date: '2026-11-07'
  context: 'Saved setups were reachable from some interfaces only.'
  decision: 'scopeapp.WebSetups gives the panel, SCPI *SAV/*RCL and the web one set of setup slots.'
  consequences:
  - 'From the composition and settings step (S11, S13).'

- id: ADR-BOARD-INPUT-CORE-NAMES
  title: 'A board maps its panel to the UI model''s key names in its board package'
  status: accepted
  date: '2026-11-07'
  context: 'The SDS800X HD''s key-name mapping lived in its app composition.'
  decision: 'Each board package owns the mapping from its keys and knobs to the core names.'
  consequences:
  - 'From the composition and settings step (S11, S13).'

- id: ADR-RECORD-LENGTH-FROM-TRACES
  title: 'Analysis and drawing take a record''s length from the traces it carries'
  status: accepted
  date: '2026-11-07'
  context: 'Analysis and drawing read the record length from C1, so a scope with C1 switched off analysed and drew nothing.'
  decision: 'The length comes from whichever traces the frame carries; no channel is assumed present.'
  consequences:
  - 'Any channel subset works on any scope; the two-channel CML is unchanged (C1 or C2 always carries the record).'

- id: ADR-AUTODETECT-PAIR
  title: 'The bus search reads a named pair of channels'
  status: proposed
  date: '2026-11-07'
  context: 'The bus search read C1 and C2. A four-channel scope has more lines than the search can take in its time budget.'
  decision: 'The search takes a named pair; the UI model picks the two busiest lines. On two channels that is C1 and C2, as before.'
  consequences:
  - 'Buses with three or more lines on a four-channel scope are searched only through their two busiest lines; to review once a four-channel unit is available.'

- id: ADR-SCREEN-FRACTIONS-NOT-CODES
  title: 'Mask tolerance and autoset clip windows are in screen divisions'
  status: accepted
  date: '2026-11-07'
  context: 'The mask tolerance and autoset''s clip window were in 8-bit converter codes, which mean different voltages on a 12-bit scope.'
  decision: 'Both are held in divisions of the screen and turned into codes by the board''s code format.'
  consequences:
  - 'The CML''s values convert to the same codes, so its behaviour is unchanged; a 12-bit scope gets the same visual tolerance.'

- id: ADR-BODE-IN-CORE
  title: 'The frequency response is the core''s'
  status: accepted
  date: '2026-11-07'
  context: 'The Bode sweep and its single-bin measurement lived in the CML''s engine.'
  decision: 'The measurement on any reference and DUT channel, the sweep a HAL scope runs beside its owner loop, and its web serving (bodemode, bodeclear, /api/bode) are in the core.'
  consequences:
  - 'Every scope with a signal source gets Bode; the CML''s engine uses the core measurement.'

- id: ADR-REFS-OWN-STORE
  title: 'References have a store of their own'
  status: accepted
  date: '2026-11-07'
  context: 'References are kilobytes a channel and change only when stored or cleared, while the setup file is rewritten on every settled knob; a recalled setup should not bring back the references stored with it.'
  decision: 'References live in references.json in the scope''s settings store, beside the setup file, with each channel''s screen columns and the V/div, offset and probe they were stored at, for any channel count.'
  consequences:
  - 'Setup writes stay small; references redraw at the same volts and time on any scope.'

- id: ADR-INVERTER-N
  title: 'Invert covers N channels and a scope without it refuses with the reason'
  status: accepted
  date: '2026-11-07'
  context: 'Invert was two fields reached through the CML''s SCPI INVS pair.'
  decision: 'The UI model inverts any channel through the board; a board without invert reports it absent and the request is refused with the reason. The CML''s two channels go through a two-channel adapter over its INVS pair.'
  consequences:
  - 'C3/C4 invert is kept in settings for any channel count.'

- id: ADR-SHEETSSEQ-LIVE
  title: 'Live MEAS row values move SheetsSeq'
  status: proposed
  date: '2026-11-07'
  context: 'The web read the MEAS sheet''s live values only when something else changed the sheets, so they went stale.'
  decision: 'A change in a MEAS row''s live value moves SheetsSeq, so the web fetches the sheets again.'
  consequences:
  - 'More sheet fetches while MEAS is open; to review if the web''s request rate matters.'

- id: ADR-PROVENANCE-HARDWARE-FACTS
  title: 'Hardware facts are published as hardware description; vendor material never is'
  status: accepted
  date: '2026-11-07'
  context: 'The family rule kept anything derived from vendor firmware or bitstreams out of public repositories. Taken literally, that also kept out the register maps, initialisation sequences, timings and pin maps a scope cannot run without, so a scope could not be published, or joined by people who own one, before the family owner had measured every fact on a unit. The owner decided to publish such facts.'
  decision: 'Hardware facts may be published as hardware description, in our own words and without attribution, marked UNVERIFIED until measured on a unit: register maps, initialisation values and sequences, timings, pin and ball maps, I/O standards and key codes, also when they were learned from the vendor firmware or bitstream. Never published: vendor code, vendor files verbatim or transcribed, vendor strings, symbol, function and accessor names, internal codenames, and descriptions of how the vendor firmware behaves internally. Interoperation literals stay verbatim: device paths, file names the firmware must open or forbid, device-tree compatibles, and the public instrument interface (SCPI names from the public guides, waveform formats and their public field names).'
  consequences:
  - 'A scope repository can be public before a unit is on the family''s bench; its specifications say which facts are UNVERIFIED, and its status says verified in simulation only.'
  - 'The provenance review of a scope repository checks its whole tree and history against this line: facts stay, attributions, internals and vendor strings go.'
  - 'open-dso/docs/contributing.md states the rule for contributors; the family requirement REQ-FAM-007 is verified against it.'

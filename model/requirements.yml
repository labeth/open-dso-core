  - FU-DSO-FRAMECALC
  - FU-DSO-RENDER
  - FU-DSO-WEBCLIENT
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run TestPeaksJS via its original Go-to-Node runner for synthetic tone frequencies, magnitude-order
    stability, selection, flat input, component isolation, noninteger cycles, gaps and carrier removal. Run four
    additional FFT/peak boundary cases in scripts/check_browser_pure.py. The tests execute pure JavaScript under
    Node, not a browser or instrument. LCD TestRenderAltViews checks channel-colored output and marker exclusion,
    not spectral accuracy. Separate overlay checks compare all complex bins against direct DFT for deterministic
    16/32-point inputs at absolute tolerance 1e-10, demonstrate unsampled trailing data in a 31-sample record and
    characterize a flat spectrum peak. These are bounded host checks. Original super-resolution tests check two
    synthetic 700/800 MHz peaks within 3 percent, using supplied fine-grid means. The float-versus-quantized test
    compares arithmetic mean of peak-normalized magnitudes including signal bins, despite its median/noise-floor
    comment; it is not calibrated noise-floor evidence. Selected original LCD golden tests compare supplied synthetic
    fixtures against checked-in RGB images with a 64-pixel tolerance; they preserve existing image defects and do
    not establish physical accuracy. See final-node-suites-source-review.json and final-node-suites-test-run.json
    for the unchanged original Node fixture suite and its scope limitations.
  notes: Source-derived contract. peaks.js uses the largest power-of-two prefix (at least 16 samples), subtracts
    its mean and applies a Hann window. Peaks exceed a relative floor and two-neighbor local maximum test; strongest
    candidates are returned in frequency order. Selection uses nearest frequency with the first entry winning ties.
    The component helper fits cosine/sine coefficients over nonnegative samples, synthesizes values across gaps
    and returns null for all-gap input. Caller-supplied dimensions, Nyquist and options are preconditions rather
    than comprehensively validated inputs. LCD FFT uses a power-of-two size capped at 8192 and floor-divided integer
    stride; a trailing record portion can remain unused. Each channel is peak-normalized independently, and a flat
    spectrum reports the lower visible-bin frequency. Physical spectral accuracy remains unqualified. Super-resolution
    FFT uses the next power of two capped at 8192, resamples the fine-grid array at sample centers and adjusts effective
    Nyquist. Above-cap arrays have no explicit anti-alias filtering; a 16384-bin alternating grid resamples to a
    constant in the bounded characterization. NaN or infinite sample intervals can produce an accepted plan with
    zero Nyquist. Gap-filled FFT samples do not retain the XY validity mask. Browser app_fft.js caches spectra by
    source-array identity only; sample-period and stride changes do not invalidate that cache. Raw FFT selection
    requires raw C1, uses display-frame length for stride, and can combine display C2 fallback with raw sample timing.
    Subsampling has no anti-alias filter. See browser-traces-source-review.json; isolated checks characterize these
    limitations rather than prove correct physical spectra.

- id: REQ-DSO-267
  title: Tuner, pitch strip, V/oct and drift
  text: The instrument shall name the tuned channel's pitch as a note and cents against a settable A4 with a needle,
    a strobe and the last ten seconds of pitch, tabulate V/oct points of a CV on the other channel against the pitch
    with the scale and high-end errors, and log the pitch once a second.
  status: implemented
  realizes:
  - CAP-DSO-SOUND
  category: functional
  appliesTo:
  - FU-DSO-RENDER
  - FU-DSO-SOUND
  - FU-DSO-WEBCLIENT
  verificationMethods:
  - test
  verificationCriteria: Sines from 27.5 Hz to 4.2 kHz through the stream's quantization read within half a cent;
    squares, saws and a weak fundamental within a cent; noise reads no pitch; a VCO 1 % off in scale and 15 cents
    flat at the top reads both; Go and sound.js agree; on the device a crystal tone reads within 2 cents.
  sourceRefs:

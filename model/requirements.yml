  notes: Requests encode cmd and optional args; responses encode ok and optional err/data. The canonical client
    request stores args as any, so default JSON decoding converts numbers to float64. Response data is RawMessage.
    Contrary to the package comment, the agent declares separate types with RawMessage args and any response data.

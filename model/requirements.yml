  verificationCriteria: Inspect the sixteen-frame, 256-column population-standard-deviation calculation and publication
    admission. TestUniformityStats checks only an upper bound on centred dispersion for a repeated fake waveform;
    it does not prove telemetry updates, ring wrap or raw-versus-centred improvement.
  notes: Source-derived legacy telemetry contract. Endpoint-clamped sample extraction and a negative-anchor fallback
    to record centre are implementation policies. Fewer than two frames report zero. This is not proof of physical
    trigger locking or measured noise performance; the original test provides partial evidence only.

  verificationMethods:
  - test
  verificationCriteria: With a page's SOUND streaming the LCD names the web page or the phone; a key through /api/panel
    ends the lease, the page's stream replies come paused without leasing and its report says paused; take_scope
    streams again; AUTO ends the lease before its sweep, which reads only real captures; a headless page and phone
    show "paused - the scope is in use" with Take the scope, which streams again; the other tabs never lease.

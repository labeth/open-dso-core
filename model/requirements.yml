- id: REQ-DSO-275
  title: SOUND takes on STOP and on the FPGA's trigger
  text: The instrument shall freeze SOUND into takes as its other views freeze, namely on STOP the last 10 s or
    more of both channels, and in the NORMAL trigger mode (armed again after each take) and on SINGLE (stopping
    after it) an adjustable pre- and post-trigger stretch around the FPGA's edge on the TRIG source, level and slope
    or SOUND's gate, with AUTO the live stream; the take shown on the LCD with its trigger (Position scrolling,
    S/DIV zooming, Position moving the trigger while armed), on the web page as a scrolled and zoomed waveform,
    spectrogram and pitch with two cursors reading time, volts, frequency, level and their differences, played by
    Listen looped at full, half or quarter speed, with RUN/STOP and SINGLE on the phone, and the readouts reading
    the take at the cursor or over the visible window.
  status: implemented
  realizes:
  - CAP-DSO-SOUND
  category: functional
  appliesTo:

  verificationCriteria: The ring keeps every sample in order across its wrap with the scale, gaps and marks; a headless
    browser plays a synthetic stream with its buffer primed and no underruns, on the web page and the phone; on
    the device a crystal tone plays without underruns and the end-to-end latency is measured.
  notes: The stream is the stream image's continuous decimated stream at 2^13 (61.035 kSa/s), so the scope's triggered
    captures pause while it runs (ADR-SOUND).

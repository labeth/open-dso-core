- id: REQ-DSO-271
  title: Input against output
  text: The instrument shall compare a circuit's input on one channel with its output on the other by gain and phase
    at the fundamental, broadband gain, delay and the distortion the circuit adds, with the output against the input
    as a transfer curve and both spectra overlaid.
  status: implemented

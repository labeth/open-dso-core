- id: REQ-DSO-222
  title: Decoder Auto fills in the settings
  text: The instrument shall, when Auto is chosen as the decode protocol, detect the bus once and write its protocol,
    channel roles, rate, SPI mode and bit order into the decoder settings that every decode, stream and serial trigger
    then uses, and detect it once more when settings it filled in have decoded nothing for about two seconds of
    captures after decoding the bus.
  status: implemented
  realizes:
  - CAP-DSO-PROTOCOL-DECODE
  category: functional
  appliesTo:
  - FU-DSO-FRAMECALC
  - FU-DSO-WEBCLIENT
  verificationMethods:
  - test
  verificationCriteria: Panel tests check that Auto fills in the rows (the LCD sheet, the remote's view), that Stream
    and the serial trigger start from the filled-in or typed-in settings without detecting, that losing the bus
    for two seconds of captures detects again while one bad capture does not and settings set by hand are never
    replaced, and that a saved setup holding Auto loads as one detection. Browser tests check that the page shows
    and sets the scope's settings and that its Auto-detect runs the scope's Auto. On the device, every bench bus
    is named and its rows filled in on the LCD, the web page and the phone, Stream starts right after a detection,
    and moving the probes to another bus is detected again within a few seconds.
  notes: Auto is an action in the Protocol options, never a mode the decoder sits in; a setup saved while it was
    one holds Protocol = Auto and loads as a detection. The scope keeps no threshold setting (the decoders and the
    hardware matcher measure it), so Auto fills in none.

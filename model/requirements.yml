  notes: PrecisionLimits models CIC3 followed by the committed FIR. It excludes ADC nonlinearity, correlated noise,
    clock error and Q8 rounding. Reduction is not input-validated. The bandwidth search uses 45 bisection steps
    between 0.075 and 0.5 output sample rate. Browser precision limits display uses supplied frame metadata and

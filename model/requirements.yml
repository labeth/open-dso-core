    The browser shows the loading indicator from status busy fields and polls status fast while busy or right after
    a control change. Raw feeds request a lease explicitly (lease=raw for eye and super-resolution, lease=spectrum
    for the FFT and spectrogram - the scope's own spectrum frames, given back with end=1 when the view is left);
    mask and zone building use the live ordered frames.
- id: REQ-DSO-205
  title: Precision snapshot model fitting
  text: The instrument shall fit selected browser capture windows to sinusoidal, triangular or harmonic models and
    display model residuals separately from acquisition data.
  status: implemented
  realizes:
  - CAP-DSO-ENHANCED-RESOLUTION
  category: functional
  sourceRefs:
  - CODE-WEBCLIENT-APP-PRECISION-JS
  - CODE-WEBCLIENT-PRECISION-CALIBRATION-TEST-CJS
  appliesTo:
  - FU-DSO-WEBCLIENT
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Review browser-features-source-review.json and 13 isolated cases in browser-features-test-run.json.
    Synthetic fitting checks and mocked controller checks support only their exercised scope; no rendered pixels,
    physical accuracy, protocol qualification or real device commands.
  notes: The UI fits the whole visible window, block-averaged to at most 4096 points, and rejects clipped or nonfinite
    codes. Where the display holds min/max pairs (a screen of more samples than the page's columns) it takes one
    capture of samples through the raw feed first (min/max pairs cannot be fitted, and a stopped screen holds min/max
    pairs too). It uses the capture's sample interval and the captured vpc. Periodic fitting removes harmonic distortion
    and is not SINAD ENOB. The preview is a 2D canvas, unlike the main WebGL surfaces.

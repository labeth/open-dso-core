- id: REQ-DSO-270
  title: Audio spectrum and harmonics
  text: The instrument shall show the audio spectrum on a log frequency axis with a note grid and the scope's own
    floor, and read H1 to H10 against H1 with THD, the even/odd balance and mains hum.
  status: implemented
  realizes:

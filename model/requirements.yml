    and WAV hold previous values through gaps; VCD uses stride decimation above 131072 points and its final timestamp
    rounds capture length up to a whole stride. WAV rejects rates above uint32 range. ZIP64, allocation limits,
    arbitrary nonfinite calibration and external-reader compatibility are not established by the current offline
    checks.

- id: REQ-DSO-229
  title: SPI, UART and I2C decoded on the samples
  text: The instrument shall decode two-wire SPI, UART and I2C in the FPGA from the converters' samples, timing
    each line's edges by interpolation between samples, and trigger on the decoded bytes for SPI clocks up to 104
    MHz, UART rates up to 62.5 MBd and I2C clocks up to 3.4 MHz.
  status: implemented
  realizes:
  - CAP-DSO-PROTOCOL-DECODE
  category: functional
  appliesTo:
  - FU-DSO-DECODE
  - FU-DSO-WEBCLIENT
  verificationMethods:
  - test
  verificationCriteria: The Go models of the receivers decode without a bit error synthetic buses (SPI at 1 to 104
    MHz in all four modes, both bit orders and inverted; UART at 115200 Bd to 62.5 MBd in 5 to 9 data bits, no,
    even and odd parity, one and two stop bits, inverted, with the transmitter 2 % fast and slow; I2C at 100 kHz,
    400 kHz, 1 MHz and 3.4 MHz with open-drain rise times, ten-bit addresses, repeated STARTs and NACKs, SDA held
    5 ns) and records of the bench sources (SPI 10 to 104 MHz, UART 1 to 62.5 MBd, I2C 400 kHz to 3.4 MHz); the
    RTL finds the models' edges and publishes their events and matches on the same clocks, and the fast image's
    top level decodes and triggers on them from register writes. On the device, byte triggers fire on the model's
    match in every triggered record, and decoded-event streams carry every character and transfer the sources sent,
    at each rate.
  notes: Four samples a channel per 125 MHz receiver clock; a crossing is the first sample at or past the level
    after one beyond the re-arm band (re-armed once beyond the band's other edge, or after a whole clock beyond
    its own), timed in sixteenths of a nanosecond. SPI reads the data line at the sample nearest the clock's crossing
    plus the channels' sampling phase (C2 1.44 ns after C1) and a data delay; one sampling edge a receiver clock
    bounds the clock at 125 MHz and an idle gap frames bytes. UART reads bit k at the start's crossing plus k and
    a half bit times, re-timed by every edge in the frame; a bit of at least 16 ns. I2C orders the two lines' crossings
    in a clock by their times; SCL's rising reads SDA, SDA's crossings read SCL (START, STOP).
  sourceRefs:

- id: REQ-DSO-010
  title: Timebase planning
  text: The instrument shall select a capture and display plan for the requested timebase.
  status: implemented
  realizes:
  - CAP-DSO-ACQUISITION
  category: functional
  sourceRefs:
  - CODE-MEASURE-FRAME-GO
  appliesTo:
  - FU-DSO-MEASURE
  notes: Source-derived contract; source presence is not evidence of a passing hardware qualification. Live frames
    follow ADR-LIVE-ORDERED-ENVELOPE (which replaced ADR-IMAGE-REGROUP-DECIMATION's live-frame policy). While running
    and not serving a SINGLE, every live frame is read as the FPGA envelope of the full-depth capture (2048 buckets
    for raw records, 1024 for Q8.8, the reducer limit being 2048 output words), with each min and max pair put in
    time order (orderEnvelope, Frame.Ordered) so decode, masks and software qualifiers run on it. Averaging, ERES,
    precision, a sample lease and an image without the reducer use a decimated live capture of at most 8192 samples
    per screen (liveSRAMPlan); Bode and a raw lease read raw windows. STOP and SINGLE recall the full record; a
    stopped record is held in memory, recalled and conditioned, so V/div, offset and timebase changes replay it
    without an SRAM read (ADR-STOPPED-RECORD-IN-MEMORY). Status reports live_readout and frame_stages. A live envelope
    covers at least the screen - its words per bucket round up and the window widens about its centre. A live envelope
    of a full-rate record also carries two full-rate edge windows (1024 words around the trigger edge and around
    the next edge the other way) for rise, fall and over/preshoot. SINGLE publishes its capture as a live frame
    and stops; the stop then reads that capture's full record, keeping the trigger the live frame was shown at.
    A roll view marks the samples no capture covered (held between chunks); they are drawn dimmed and measurements
    read the longest captured stretch. A zoom (the scope's or the web page's) that shows fewer of a live envelope's
    pairs than its columns leases its stretch, which is read again from the same capture at a min/max pair per column
    and drawn in place of the screen's pairs.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Inspect the linked implementation and run the corresponding offline tests; hardware claims
    require independently identified device evidence.
- id: REQ-DSO-011
  title: Trigger qualification
  text: The instrument shall qualify capture publication using the selected trigger policy.
  status: implemented
  realizes:
  - CAP-DSO-TRIGGER
  category: functional
  sourceRefs:
  - CODE-DECODE-AUTOTHRESHOLD-TEST-GO
  - CODE-DECODE-DECODE-GO
  - CODE-WEBCLIENT-APP-CONTROLS-JS
  - CODE-WEBCLIENT-QUALIFIER-SYNC-TEST-CJS
  appliesTo:
  - FU-DSO-DECODE
  - FU-DSO-WEBCLIENT
  notes: Source-derived contract; source presence is not evidence of a passing hardware qualification. SINGLE ends
    only on a capture armed, or still waiting for its event, after the press (ADR-SINGLE-PRESS-GENERATION); a frame
    already frozen when SINGLE is pressed publishes as a live frame. The capture serving a SINGLE is recalled whole
    once and held for the stop. Pulse width, slope time and video line triggers are decided by the qualifier FPGA
    image (ADR-HARDWARE-QUALIFIERS); the engine plans them from the learned signal extent, publishes no triggered
    frame while no hardware plan exists, and only places the trigger point on the qualified event.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Inspect the linked implementation and run the corresponding offline tests; hardware claims
    require independently identified device evidence.

  - FU-DSO-WEBSERVER
  verificationMethods:
  - test
  verificationCriteria: Panel tests cycle Packets, Eye diagram and Stream with F2 and check that the Stream view
    starts the stream with the sheet's stop and value, that F2, another workspace and the Stream row Off end it
    with the scope running again, that the Stream row reads the view's state and puts BUS on the view from another
    workspace, and that with no bus the view says so and the Adjust push detects one; an LCD golden of the view.
    On the device, the view cycle on the FPGA UART source with its timings, and every bench bus streamed with each
    stop.
  notes: Adjust picks the stop (a decode error, the Stream value, Run/Stop by hand) and a running stream starts
    again with it; its push and Run/Stop stop and restart the stream; Position's push turns Position to scrolling
    the transcript; Zoom shows a stopped stream's list or its record's waveform. A detection or AUTO ends the stream

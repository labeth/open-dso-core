- id: REQ-DSO-104
  title: Persisted agent control flags
  text: The instrument shall serialize agent control flags to a JSON state file and report persistence failures.
  status: implemented
  realizes:
  - CAP-DSO-SUPERVISED-OPERATION
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-AGENT-GO
  - CODE-SUPERVISOR-AGENT-PERF-BENCH-TEST-GO
  - CODE-SUPERVISOR-AGENT-RPC-TEST-GO
  - CODE-SUPERVISOR-AGENT-STATE-GO
  - CODE-SUPERVISOR-AGENT-TAKEOVER-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  notes: A mutex serializes each stateFile instance. Update mutates the live state first, writes a fixed .tmp path,
    syncs and closes the file, then renames it. Directory sync is best effort. Failures do not roll back the live
    state and may leave a temporary file. Load ignores file-read and JSON decode errors; a type error can leave
    successfully decoded fields applied. The mutex does not coordinate independent stateFile instances. This behavior
    does not establish power-loss durability on a particular filesystem or device.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: The untakeover fixture checks clearing both flags and reloading them in a new agent. A test-only
    state probe characterizes memory/disk divergence after a failed write and partial application of malformed JSON.
    Those boundary observations document limitations, not passing durability requirements.
- id: REQ-DSO-105
  title: Agent health-file liveness
  text: The instrument shall observe health-file changes and apply first-report grace and subsequent staleness deadlines.
  status: implemented
  realizes:
  - CAP-DSO-SUPERVISED-OPERATION
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-HEALTH-GO
  - CODE-SUPERVISOR-AGENT-HEALTH-TEST-GO
  - CODE-SUPERVISOR-AGENT-PERF-BENCH-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  notes: The watcher attempts to remove the old token at construction, ignoring removal errors. Poll compares mtime,
    size and up to 256 content bytes; stat errors return without updating, and read errors are ignored. An observed
    change sets HealthyOnce and a local monotonic observation time. This does not validate coherent frames or token
    semantics. Changes outside the prefix can be missed if size and mtime are unchanged. Verdict treats waiting
    within grace as healthy and uses strict greater-than comparisons for expiry. Status rounds elapsed duration
    to millisecond precision, but since_change_ms serializes the duration as nanoseconds.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Temporary-file tests cover first-report grace, refreshed versus stale tokens and removal
    of a preexisting token. A serialization overlay reproduces the mislabeled timing unit as a limitation, not requirement
    satisfaction. Device acquisition health, removal/read failures and unsampled content changes remain unqualified.
- id: REQ-DSO-106
  title: Chunked file upload sessions
  text: The instrument shall receive file chunks into upload sessions and validate declared size and digest before
    destination replacement.
  status: implemented
  realizes:
  - CAP-DSO-FIRMWARE-UPDATE
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-HANDLERS-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-TEST-GO
  - CODE-SUPERVISOR-AGENT-PERF-BENCH-TEST-GO
  - CODE-SUPERVISOR-AGENT-UPLOAD-GO
  - CODE-SUPERVISOR-AGENT-UPLOAD-HASH-TEST-GO
  - CODE-SUPERVISOR-AGENT-UPLOAD-TEST-GO
  - CODE-SUPERVISOR-SLOTS-SLOTS-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  - FU-DSO-SUPERVISOR-SLOTS
  notes: Cleaned destinations must be absolute. Temporary files reside in the destination directory. The eight-session
    limit is checked after directory creation. Sessions older than ten minutes are evicted only when another upload
    starts. Writes track a high-water offset, not byte coverage; positive sizes bound writes and require a SHA-256
    digest at commit. Nonpositive sizes do neither. Commit syncs and closes before validation, then hashes, chmods
    and renames. Failed commits can retain closed sessions and exhaust capacity until later eviction. fileSHA treats
    all read errors as EOF and can return a partial digest without an error. Directory sync is absent. Eviction
    does not acquire the session mutex, so the sequential tests do not establish concurrent eviction safety or durability.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Test complete out-of-order transfer with a declared digest and rejection of a missing-hash
    sparse upload. Temporary-file probes characterize failed-commit capacity exhaustion, pre-rejection directory
    creation, lazy eviction and ignored hash read failures. These observations document limitations; they do not
    qualify concurrent sessions, transport framing, arbitrary failure recovery or device filesystem durability.
- id: REQ-DSO-107
  title: TCP agent command transport
  text: The instrument shall dispatch JSON command requests received over TCP and return JSON response lines.
  status: implemented
  realizes:
  - CAP-DSO-FIRMWARE-UPDATE
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-PERF-BENCH-TEST-GO
  - CODE-SUPERVISOR-AGENT-TCP-GO
  - CODE-SUPERVISOR-AGENT-TCP-SERVE-TEST-GO
  - CODE-SUPERVISOR-AGENT-TCP-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  notes: The configured plain TCP listener has no authentication or TLS in this implementation. Each accepted connection
    receives a goroutine; no connection-count limit is enforced here. ReadBytes uses newline framing and a one-MiB
    buffer, which does not limit request size. A nonempty final fragment is dispatched even when the read also reports
    an error. Read and write deadlines are 120 and 30 seconds; they do not bound handler execution. Stop is checked
    between accepts and does not directly unblock an idle listener. Existing connection handlers do not check the
    stopped channel. TCPAddr exposes the recorded bound address, not ongoing readiness.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run the in-memory client-envelope test and loopback socket tests for repeated requests,
    malformed-request recovery, interleaved connections and listener closure after Stop plus another accept. An
    in-memory overlay confirms acceptance beyond one MiB. These tests do not establish prompt idle shutdown, closure
    of existing connections, authentication, resource bounds or behavior on the device network.
- id: REQ-DSO-108
  title: NATS agent command and event transport
  text: The instrument shall dispatch NATS command requests and publish lifecycle events and periodic status heartbeats.
  status: implemented
  realizes:
  - CAP-DSO-FIRMWARE-UPDATE
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-NATS-GO
  - CODE-SUPERVISOR-AGENT-PERF-BENCH-TEST-GO
  - CODE-SUPERVISOR-OTACTL-NATS-E2E-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  - FU-DSO-SUPERVISOR-OTACTL
  notes: Subjects use ota.<device>.rpc, ota.all.rpc, ota.discover, ota.<device>.event and ota.<device>.heartbeat.
    Device text is concatenated without validation here. RPC messages execute even without a reply subject. Initial
    connect failures retry after five seconds; client reconnect attempts are unlimited with two-second wait. Reconnect
    buffering is disabled. Optional CA, credentials and NKey settings delegate authentication to the client and
    broker; invalid NKey seed is logged and its option omitted. Publish errors are ignored, so delivery is not guaranteed.
    The online event occurs when serveNATS starts; the reconnect callback only logs. Heartbeat increments a sequence
    and collects status fields without an atomic cross-component snapshot.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run the isolated localhost broker test through real agent and host client transports. Verify
    device RPC subject, initial online event, heartbeat identity/sequence, and selected ping, status, deterministic
    exec and error parity with TCP. This does not verify reconnect announcements, broker policies, TLS, credential
    failures, fleet broadcast, discovery, delivery under disconnection or device networking.
- id: REQ-DSO-109
  title: Host command transport
  text: The instrument shall provide host-side TCP and NATS command transports with structured device responses.
  status: implemented
  realizes:
  - CAP-DSO-FIRMWARE-UPDATE
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-CMD-OTACTL-MAIN-GO
  - CODE-SUPERVISOR-OTACTL-CLI-GO
  - CODE-SUPERVISOR-OTACTL-CLIENT-GO
  - CODE-SUPERVISOR-OTACTL-CLIENT-TEST-GO
  - CODE-SUPERVISOR-OTACTL-NATS-E2E-TEST-GO
  - CODE-SUPERVISOR-OTACTL-PERF-BENCH-TEST-GO
  - CODE-SUPERVISOR-OTACTL-TRANSPORT-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-OTACTL
  notes: TCP opens a connection per call with a fixed five-second dial timeout followed by the caller I/O deadline.
    The caller timeout excludes dial time. NATS uses ota.<device>.rpc and the request timeout. Both transports ignore
    request marshal errors. TCP accepts a nonempty response fragment even with a read error; its one-MiB reader
    does not cap response length. Client.Call converts OK=false into an error while retaining Data. NATS Close ignores
    Drain errors. Transport success does not imply command success.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run reviewed localhost ping/echo, device-error and dial-failure tests plus the isolated
    NATS parity test. These do not qualify reconnect, credential policy, malformed argument serialization, complete
    timeout behavior or device networking.
- id: REQ-DSO-110
  title: Host file transfer and update initiation
  text: The instrument shall provide host-side file transfer and update initiation commands.
  status: implemented
  realizes:
  - CAP-DSO-FIRMWARE-UPDATE
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-OTACTL-CLI-GO
  - CODE-SUPERVISOR-OTACTL-CLIENT-GO
  - CODE-SUPERVISOR-OTACTL-CLIENT-TEST-GO
  - CODE-SUPERVISOR-OTACTL-PERF-BENCH-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-OTACTL
  notes: PutFile hashes then rewinds the local file, sends base64 chunks and compares the final digest. It has no
    retry, resume or abort path and ignores chunk written counts and begin/commit decode errors. Positive chunk
    sizes have no upper bound here. Progress counts sent bytes, not committed bytes. GetFile creates or truncates
    the destination before its first request, then stops on EOF or empty data without enforcing advertised size
    or a digest. Errors leave partial output; Close errors are ignored. Updates upload fixed staging names with
    mode 0755 and invoke the update RPC, without waiting for healthy activation. Timeouts are per request, not per
    transfer.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run the temporary-file round trip with digest, bytes, mode and progress assertions and the
    missing-source test. A fake-transport overlay reproduces successful early truncation on an empty non-EOF reply
    and truncation on first-request failure. These are limitations, not full integrity or activation qualification.
- id: REQ-DSO-111
  title: Host embedded broker startup
  text: The instrument shall provide a host-side embedded NATS broker startup command.
  status: implemented
  realizes:
  - CAP-DSO-FIRMWARE-UPDATE
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-OTACTL-CLI-GO
  - CODE-SUPERVISOR-OTACTL-SERVER-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-OTACTL
  notes: RunServer takes bind host and port, disables JetStream and signal handling, waits ten seconds for readiness,
    optionally prints the client URL and blocks for shutdown. It configures no authentication or TLS here, exposes
    no cancellation handle and does not call Shutdown when readiness fails. The separate end-to-end fixture constructs
    its own broker and does not exercise this wrapper.
  verificationMethods:
  - inspection
  verificationCriteria: Inspect startup, readiness, banner and shutdown paths. No dedicated wrapper test or deployed
    broker qualification is available.
- id: REQ-DSO-112
  title: Host relay recovery control
  text: The instrument shall provide host-side relay commands for external power-cycle recovery.
  status: implemented
  realizes:
  - CAP-DSO-FIRMWARE-UPDATE
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-OTACTL-CLI-GO
  - CODE-SUPERVISOR-OTACTL-SHELLY-BENCH-TEST-GO
  - CODE-SUPERVISOR-OTACTL-SHELLY-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-OTACTL
  notes: The Shelly helper uses plain HTTP with an eight-second default client timeout. On and Off require HTTP
    200 but ignore body-read errors and read at most 4096 bytes. State decodes ison without checking HTTP status;
    missing ison defaults false. Cycle sends Off, sleeps the supplied duration and sends On. It does not verify
    relay state, voltage or instrument recovery and does not retry a failed On request. Nonpositive durations do
    not enforce an off interval.
  verificationMethods:
  - inspection
  verificationCriteria: Inspect request URLs, response handling and cycle ordering. No physical plug operation or
    device-recovery qualification was performed; no dedicated relay test is linked.
- id: REQ-DSO-113
  title: Agent RPC dispatch and serialization
  text: The instrument shall dispatch agent JSON commands and return structured success or error responses.
  status: implemented
  realizes:
  - CAP-DSO-FIRMWARE-UPDATE
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-HANDLERS-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-TEST-GO
  - CODE-SUPERVISOR-AGENT-PERF-BENCH-TEST-GO
  - CODE-SUPERVISOR-AGENT-RPC-GO
  - CODE-SUPERVISOR-AGENT-RPC-SPLIT-TEST-GO
  - CODE-SUPERVISOR-AGENT-RPC-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  notes: Dispatch rejects malformed requests and unknown commands, preserves handler data alongside returned errors,
    and converts recovered handler panics to error responses while logging the stack. It does not guarantee that
    returned Data can be JSON encoded. DispatchJSON replaces an unencodable response with an error-only envelope.
    Missing args decode to the zero value; a JSON type error may return partially decoded fields alongside the error.
    This layer provides no authorization, command timeout or transactional rollback. The mutable command registry
    initializes 23 commands; registration overwrites duplicate names without synchronization. Help returns sorted
    registered command names.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run reviewed malformed-request, unknown-command, ping, panic-containment and selected handler-error
    response tests. The app-start refusal assertion checks error propagation, not a complete lifecycle policy. A
    temporary overlay checks direct unencodable data, the JSON error fallback, omitted arguments and partial argument
    decoding. Takeover refusal and dry-run tests provide separate partial evidence for takeover. These checks do
    not establish every handler contract or transport security.
- id: REQ-DSO-114
  title: Agent diagnostic responses
  text: The instrument shall expose identity, status and optional register-probe results through agent diagnostics.
  status: implemented
  realizes:
  - CAP-DSO-FIRMWARE-UPDATE
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-AGENT-GO
  - CODE-SUPERVISOR-AGENT-AGENTTEST-AGENTTEST-GO
  - CODE-SUPERVISOR-AGENT-FAKEBOARD-TEST-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-TEST-GO
  - CODE-SUPERVISOR-AGENT-PERF-BENCH-TEST-GO
  - CODE-SUPERVISOR-AGENT-TAKEOVER-GO
  - CODE-SUPERVISOR-OTACTL-CLI-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  - FU-DSO-SUPERVISOR-OTACTL
  notes: Ping returns device identity, current Unix time and agent slot. Status combines separately collected state,
    app, slot, watchdog, descriptor and system fields; it is not an atomic snapshot. Probe argument decoding errors
    are ignored, and register reads are opt-in through the decoded flag. Probe shell commands run sequentially with
    per-command timeouts and ignored command errors; missing tools can yield empty output. No complete probe deadline
    or coherent hardware snapshot is guaranteed. Probe shell errors are discarded, and GPMC version read failure
    is conflated with an unexpected value; fill read errors omit the field. AgentSlot resolves executable and configured
    symlinks; matching both configured paths gives unspecified A/B selection.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run the status response-shape test and inspect ping/probe delegation. This does not execute
    device probing, qualify register reads or establish every diagnostic field.
- id: REQ-DSO-115
  title: Agent command execution and log reads
  text: The instrument shall provide command execution and log-tail operations through the agent.
  status: implemented
  realizes:
  - CAP-DSO-FIRMWARE-UPDATE
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-EXEC-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-TEST-GO
  - CODE-SUPERVISOR-AGENT-PERF-BENCH-TEST-GO
  - CODE-SUPERVISOR-OTACTL-CLI-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  - FU-DSO-SUPERVISOR-OTACTL
  notes: Exec and shell handlers reject malformed arguments and empty commands; nonpositive converted timeouts default
    to thirty seconds. Commands inherit the agent environment and privileges. Combined output has no size bound,
    and command-start failure can return exit zero alongside an error. CommandContext kills the direct command,
    but a descendant retaining the output pipe can delay return beyond the timeout; a 500 ms fixture returned after
    about two seconds. Logs ignores argument decode errors, permits a supplied path and defaults nonpositive tails
    to 8192 bytes. Tail reads to EOF after stat/seek, so file growth can exceed the requested amount.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run reviewed log-tail, argv/exit-data and shell tests plus the isolated missing-executable
    and descendant-pipe characterization. No arbitrary production command, factory process, device access or complete
    timeout guarantee is tested.
- id: REQ-DSO-116
  title: Agent file-read chunks
  text: The instrument shall return file-read chunks through the agent.
  status: implemented
  realizes:
  - CAP-DSO-FIRMWARE-UPDATE
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-HANDLERS-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-TEST-GO
  - CODE-SUPERVISOR-AGENT-PERF-BENCH-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  notes: Get decodes path, offset and length, replacing lengths outside 1..524288 with 262144, then returns base64
    bytes, offset, EOF and file size. Stat errors are ignored; every ReadAt error becomes EOF while the handler
    returns no error. A negative-offset fixture returns success with empty data and EOF. This does not establish
    snapshot consistency, an integrity digest or complete transfer.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run middle-chunk, short-tail and missing-file assertions plus the negative-offset characterization.
    Concurrent file changes and complete transfer integrity remain unqualified.
- id: REQ-DSO-117
  title: Agent application control requests
  text: The instrument shall provide guarded application start, stop and restart requests.
  status: implemented
  realizes:
  - CAP-DSO-SUPERVISED-OPERATION
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-AGENT-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-TEST-GO
  - CODE-SUPERVISOR-AGENT-PERF-BENCH-TEST-GO
  - CODE-SUPERVISOR-AGENT-RPC-TEST-GO
  - CODE-SUPERVISOR-AGENT-SUPERVISE-GO
  - CODE-SUPERVISOR-AGENT-SUPERVISE-TEST-GO
  - CODE-SUPERVISOR-OTACTL-CLI-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  - FU-DSO-SUPERVISOR-OTACTL
  notes: Start and restart require TakenOver; stop does not. Start resets the failure count before requesting control.
    Start uses five seconds and stop/restart eight seconds for each control-channel phase. A timed-out queued request
    is not cancelled. Returned handler data may contain ok=true alongside an outer RPC error. These requests do
    not guarantee application health or immediate completion of every process transition. Control requests have
    separate send and reply timeouts, no stopped-channel case and no cancellation after timeout. Idle control rejects
    unknown operations; active/adopted control tears down on any operation.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run pre-takeover start refusal and idle-supervisor start/stop/restart tests. The control-timeout
    overlay shows a queued request can take effect after the caller times out. Actual device takeover and running-application
    restart are not qualified.
- id: REQ-DSO-118
  title: Agent application slot installation
  text: The instrument shall install application payloads and select installed application slots.
  status: implemented
  realizes:
  - CAP-DSO-FIRMWARE-UPDATE
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-HANDLERS-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-TEST-GO
  - CODE-SUPERVISOR-OTACTL-CLI-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  - FU-DSO-SUPERVISOR-OTACTL
  notes: Application update installs to the other active slot, sets the active pointer and resets the failure count.
    Supplied-digest checks are specified by REQ-SDS-029. Activation normalizes the slot name and requires a nonempty
    regular file, without checking image validity or execute permission. When TakenOver, update/activation request
    restart but ignore its errors. Successful responses do not prove launch, health confirmation or rollback behavior.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run temporary-file inactive-slot installation, activation normalization/empty-slot refusal
    tests. The isolated activation fixture proves acceptance of non-image contents and missing executable bits without
    launching a payload.
- id: REQ-DSO-119
  title: Agent self-update and restart handoff
  text: The instrument shall stage an agent slot update and request a clean exit for boot-loop handoff.
  status: implemented
  realizes:
  - CAP-DSO-FIRMWARE-UPDATE
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-EXEC-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-TEST-GO
  - CODE-SUPERVISOR-AGENT-SELFUPDATE-TEST-GO
  - CODE-SUPERVISOR-OTACTL-CLI-GO
  - CODE-SUPERVISOR-SLOTS-SLOTS-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  - FU-DSO-SUPERVISOR-OTACTL
  - FU-DSO-SUPERVISOR-SLOTS
  notes: Agent update selects A only when currently running B; otherwise it targets B. It copies the source, writes
    the active pointer and schedules Stop/exit zero after 750 ms. Restart schedules exit after 500 ms. The supplied
    digest is optional under REQ-SDS-029. Copy uses a fixed temporary path, file sync and rename, but no directory
    sync or chmod of an existing temporary file; a fixture retains mode 0600. Active-pointer write uses temporary
    write/rename without sync. Intent-marker write errors are ignored. Handler success does not prove boot-loop
    respawn, adoption, rollback, executable image validity or durable markers.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run captured-exit update/restart tests and digest refusal tests. Check exact installed bytes,
    active/intent markers and Stop notification. Copy-mode and omitted-digest fixtures record limits. The test hook
    captures process exit; no real agent replacement or payload launch occurs.
- id: REQ-DSO-120
  title: Agent untakeover control
  text: The instrument shall provide an untakeover control that hands the scope back to the factory app at the next
    power-on.
  status: implemented
  realizes:
  - CAP-DSO-SUPERVISED-OPERATION
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-HANDLERS-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  notes: Untakeover ignores stop-request failure, clears persisted takeover flags, resets the failure count and
    disarms the watchdog; it does not relaunch the factory program. The factory program is not relaunched in place
    by any control - a relaunch does not drive the scope - so it comes back only from a power-on.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run only the taken-over and missing-path refusal tests. Inspect launch/options and descriptor
    release; do not execute a factory program, read PID-1 environment or claim successful physical recovery.
- id: REQ-DSO-121
  title: Agent reboot confirmation gate
  text: The instrument shall require a decoded confirmation flag before requesting reboot through the agent.
  status: implemented
  realizes:
  - CAP-DSO-FIRMWARE-UPDATE
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-AGENTTEST-AGENTTEST-GO
  - CODE-SUPERVISOR-AGENT-FAKEBOARD-TEST-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-TEST-GO
  - CODE-SUPERVISOR-OTACTL-CLI-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  - FU-DSO-SUPERVISOR-OTACTL
  notes: The handler ignores argument decoding errors but rejects a false decoded confirm flag. A true flag invokes
    sync followed by a delayed background reboot shell command with a five-second direct-command timeout. A reply
    does not establish that reboot happened or that the instrument recovered.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run the missing-confirmation refusal test only. No confirmed reboot or device recovery is
    executed.
- id: REQ-DSO-122
  title: Agent runtime initialization and shutdown
  text: The instrument shall initialize agent state and services and accept a stop notification.
  status: implemented
  realizes:
  - CAP-DSO-SUPERVISED-OPERATION
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-AGENT-GO
  - CODE-SUPERVISOR-AGENT-AGENTTEST-AGENTTEST-GO
  - CODE-SUPERVISOR-AGENT-BOARD-GO
  - CODE-SUPERVISOR-AGENT-FAKEBOARD-TEST-GO
  - CODE-SUPERVISOR-AGENT-TAKEOVER-GO
  - CODE-SUPERVISOR-OTACTL-NATS-E2E-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  - FU-DSO-SUPERVISOR-OTACTL
  notes: New loads persisted state, creates the four-entry control channel and store/watchdog objects, and discovers
    inherited descriptors without acquiring the watchdog. Run logs and continues after store initialization failure
    and ignores PID-file write failure. TakenOver resumes watchdog acquisition; optional automatic takeover can
    wait without observing Stop. Run starts supervision and configured transports, then returns on the stop channel
    without joining workers or propagating worker errors. Stop disarms before closing the channel but its check/close
    sequence has no once guard, so concurrent calls can panic. In-progress watchdog acquisition is not cancelled
    and successful acquisition may finish after Stop. These are source-derived lifecycle limits, not graceful shutdown
    or watchdog qualification.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Inspect all lifecycle paths and use only the isolated coexist-mode NATS test for its selected
    Run/Stop path. No takeover, watchdog acquisition, factory or physical device behavior is exercised.
- id: REQ-DSO-123
  title: Agent event callback delivery
  text: The instrument shall log agent events and deliver them to an optional registered callback.
  status: implemented
  realizes:
  - CAP-DSO-FIRMWARE-UPDATE
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-AGENT-GO
  - CODE-SUPERVISOR-AGENT-TAKEOVER-GO
  - CODE-SUPERVISOR-OTACTL-NATS-E2E-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  - FU-DSO-SUPERVISOR-OTACTL
  notes: Event delivery logs first, copies the callback while holding eventMu and invokes it after unlocking. Registration
    replaces the callback under that mutex. Detail maps are passed without copying, and callback panic is not recovered.
    This local callback mechanism does not guarantee broker delivery, persistence or reconnect announcement.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Inspect callback locking, replacement and call order. The isolated NATS test covers selected
    initial event delivery only; callback races, panic recovery and broker delivery guarantees are not established.
- id: REQ-DSO-125
  title: Browser presentation and Bode view controls
  text: The instrument shall format browser labels and present Bode point sets with arm, clear, channel and enlarge
    controls.
  status: implemented
  realizes:
  - CAP-DSO-SIGNAL-ANALYSIS
  category: functional
  sourceRefs:
  - CODE-WEBCLIENT-APP-JS
  - CODE-WEBCLIENT-APP-VIEWS-JS
  - CODE-WEBCLIENT-BODE-JS
  - CODE-WEBCLIENT-WORKSPACES-BROWSER-MJS
  appliesTo:
  - FU-DSO-WEBCLIENT
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run TestBodeBrowser against its synthetic localhost fixture for arm POST payload, point-count
    return, enlarge and clear status behavior. Run view-glue-boundaries.cjs for formatter and equal-channel command
    behavior. Returned point count does not prove Bode pixels or measurement accuracy; formatting preconditions
    and network failures remain separate. Run original TestBodeJSHelpers/TestBodeJSBreaker and eight renderer characterizations.
    The breaker checks coordinate finiteness only for selected clean cases, despite its broader introductory comment.
    Recording-context geometry is not browser pixel accuracy.
  notes: Source-derived presentation/control contract, distinct from computing Bode transfer measurements. Helpers
    format timebase/voltage/measurement labels, convert six-digit hexadecimal colors and trim labels to a measured
    width. Bode rendering fetches point sets and tolerates fetch failure with empty data. Equal reference/DUT selection
    still posts an arm command after setting a warning; the following armed status replaces that warning. One-second
    Bode refresh and 80-millisecond spectrogram ticks are classic-script callbacks. Renderer draws magnitude/phase
    panels on a logarithmic frequency axis with 1-2-5 ticks. Positive ordered frequencies and matching finite gain/phase
    arrays are caller preconditions. Frequency formatting incorrectly renders 100 Hz, 100 kHz and 100 MHz as 1,

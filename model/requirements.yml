- id: REQ-DSO-227
  title: The web page shows the scope's references
  text: The instrument shall keep REF A and REF B on the scope, show on the web page the references the scope holds
    with the setup and probes they were stored at, and store, show, hide and delete them on the scope when the page
    does.
  status: implemented
  realizes:
  - CAP-DSO-COMPARE
  category: functional
  appliesTo:
  - FU-DSO-WEBCLIENT
  - FU-DSO-WEBSERVER
  verificationMethods:
  - test
  verificationCriteria: Panel tests store, hide, store again and clear a slot as a page does and check the status
    tags, the export (probes, setup, store time) and the rows the phone shows; handler tests check POST /api/refs;
    a browser test on the real panel stores a reference on the scope and sees it on the page, saves, hides and clears
    on the page and sees it on the scope, and checks the difference readout of identical captures. On the device,
    a reference stored on the LCD shows on the page and the phone, one saved on the page shows on the LCD, and the
    page's difference readout agrees with the LCD's.
  notes: The page keeps no references of its own; it reads both slots again when the status's Refs (each slot's
    Has, Show and store generation) changes. The difference readout compares on the reference's 800 screen columns,
    as the LCD does. The super-res model fit is a page overlay drawn in REF B's colour, not a reference.

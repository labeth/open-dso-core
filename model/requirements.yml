  verificationCriteria: A 1 V RMS tone with H2 at -40 dB and H3 at -30 dB reads 0 dBV, -40 and -30 dB, THD 3.32
    % and odd character; 50 Hz hum at -60 dBV is found; Go and sound.js agree.
  notes: Harmonics more than 90 dB under H1 do not count (past an 8-bit converter's linearity).

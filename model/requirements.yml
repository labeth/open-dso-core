- id: REQ-DSO-224
  title: AUTO frames the signal for the workspace's task
  text: The instrument shall, when AUTO is pressed outside the BUS workspace, frame the signal for the workspace's
    task, with about two cycles and the swing on about six divisions in SCOPE, at least ten cycles, the largest
    swing that stays on the screen and the cursors on one period and on the top and base in MEASURE, at least fifty cycles of the FFT source on a sampled timebase with the
    largest swing on the screen and the marker on its fundamental in SPECTRUM, and in COMPARE the setup a mask or
    reference was stored at.
  status: implemented
  realizes:
  - CAP-DSO-AUTOSET
  category: functional
  appliesTo:
  - FU-DSO-PANEL
  verificationMethods:
  - test
  verificationCriteria: Panel tests on simulated captures check each workspace's timebase, V/div, trigger and notice
    (SCOPE two cycles of 1 MHz at 200 ns/div and 500 mV/div for 3.3 V; MEASURE ten cycles; SPECTRUM fifty cycles of the
    FFT source, the marker on it, no envelope band; COMPARE the mask's or REF A's setup, else SCOPE's framing). On the
    device, AUTO in each workspace on the bench sources frames as stated, with the notice saying what it did.
- id: REQ-DSO-225
  title: AUTO leaves no trace clipped
  text: The instrument shall, after the autoset's vertical fit and again on the screen it leaves, step a channel whose
    capture runs past the screen's top or bottom for a stretch to the next coarser V/div and centre it again.
  status: implemented
  realizes:
  - CAP-DSO-AUTOSET
  category: functional
  appliesTo:
  - FU-DSO-PANEL
  verificationMethods:
  - test
  verificationCriteria: A panel test simulates a level the fit's capture misses (it shows only on the final screen) and
    checks AUTO ends coarser, unclipped, and says so; a unit test checks the stretch rule. On the device, AUTO on the
    ARINC 429 bench source twenty times leaves no channel clipped, and a bursty FlexRay bus still fits.

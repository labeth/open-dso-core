- id: REQ-DSO-230
  title: SPI data delay
  text: The instrument shall read SPI's data line, in the FPGA's receiver on the samples and in the software decoders,
    at the data delay the BUS sheet holds after the clock's sampling edge (on Auto, the middle of the data's eye
    measured on the full-rate record), and show the delay and the timing margin left each side of it.
  status: implemented
  realizes:
  - CAP-DSO-PROTOCOL-DECODE
  category: functional
  appliesTo:
  - FU-DSO-DECODE
  verificationMethods:
  - test
  verificationCriteria: A synthetic bus whose data settles 0, 3 and 7 ns after the launching edge at 104 MHz reads
    its eye's middle within 0.6 ns, and the receiver on the samples and the software decoder at that delay read
    every byte where the data at the edge does not; the bench's recorded 104 MHz bursts read data 1.8 ns early with
    the margin of 3.7 ns each side; the planner moves the receiver's delay register within its range and the panel
    row reads Auto's delay and margin. On the device, the flash look-alike's late data reads exactly at Auto's delay.
  notes: Bit k is launched on the clock edge before its sampling edge and settles t_V later, so the middle of its
    window is t_V after the sampling edge; a record cannot tell bit k late from bit k+1 early, so the bursts' ends
    decide (a device that settles late launches once more after the last sampling edge). The receiver's register
    holds -8 to 8 ns with the channels' phase.
  sourceRefs:
  - CODE-DECODE-PERF-BENCH-TEST-GO
  - CODE-DECODE-SPI-EYE-GO
  - CODE-DECODE-SPI-EYE-TEST-GO
- id: REQ-DSO-232
  title: UART-framed protocol decoding
  text: The instrument shall decode LIN (break, sync, protected identifier and checksum), DMX512 (break, mark after
    break, start code and slots), MIDI (status and data bytes with running status) and Modbus RTU (address, function,
    data and CRC-16) from one line, on the LCD and the web page alike.
  status: implemented
  realizes:
  - CAP-DSO-PROTOCOL-DECODE
  category: functional
  appliesTo:
  - FU-DSO-DECODE
  - FU-DSO-WEBCLIENT
  verificationMethods:
  - test
  verificationCriteria: Synthetic buses (LIN at 9600, 10417 and 19200 bit/s with classic and enhanced checksums
    and a header no node answers; DMX512 packets of 1 to 512 slots; MIDI channel, system and real-time messages
    with running status; Modbus RTU in 8E1, 8O1 and 8N2) decode to the frames sent, a wrong checksum, CRC or parity
    is flagged, the decoders agree with sigrok's lin, dmx512, midi and modbus decoders on the same records, and
    the JavaScript twins return the Go decoders' bytes and text.
  notes: The four read characters off the UART line with one reader (a start bit at each falling edge from idle,
    the bits sampled mid-bit); a zero character whose low lasts 11 bits or more is a LIN break, 22 bits (88 us)
    a DMX512 break. LIN's rate is read off its sync fields; Modbus's framing is the one whose frames' CRCs check.
  sourceRefs:

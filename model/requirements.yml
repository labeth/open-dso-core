- id: REQ-DSO-099
  title: Ideal precision response limits
  text: The instrument shall report ideal white-noise gain and normalized bandwidth for supported positive precision
    reductions.
  status: implemented
  realizes:
  - CAP-DSO-ENHANCED-RESOLUTION
  category: functional
  sourceRefs:
  - CODE-DSP-PRECISION-LIMITS-GO
  - CODE-DSP-PRECISION-LIMITS-TEST-GO
  - CODE-DSP-PRECISION-TEST-GO
  - CODE-WEBCLIENT-APP-PRECISION-JS

  title: Level meters
  text: The instrument shall show each channel's level as RMS, peak, peak-to-peak, DC and crest factor in volts
    and in dB against dBu, dBV or a nominal level (Eurorack 10 Vpp, +4 dBu, -10 dBV, a guitar's 100 mV), with a
    clip mark when the converter's range is reached.
  status: implemented
  realizes:

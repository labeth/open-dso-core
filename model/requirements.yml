- id: REQ-DSO-226
  title: AUTO from a page frames the page's workspace
  text: The instrument shall, when AUTO is pressed on the web page, run the AUTO of the workspace the page shows,
    whichever workspace the LCD shows, and leave the LCD's workspace as it is.
  status: implemented
  realizes:
  - CAP-DSO-AUTOSET
  category: functional
  appliesTo:
  - FU-DSO-WEBCLIENT
  - FU-DSO-WEBSERVER
  verificationMethods:
  - test
  verificationCriteria: Panel tests press AUTO for BUS with the LCD on SCOPE (BUS's scan and framing, the LCD stays
    on SCOPE) and for SPECTRUM with the LCD on BUS (fifty cycles of the FFT source), and refuse an unknown workspace;
    a handler test checks that the request carries the page's workspace; a browser test on the real panel checks
    that the page on BUS runs BUS's AUTO and the page on COMPARE COMPARE's while the LCD shows SCOPE. On the device,
    the page on BUS with the LCD on SCOPE names the bus and frames it, and the page on SPECTRUM frames for SPECTRUM.
  notes: The AUTO key keeps the LCD's workspace. The phone remote shows the LCD's workspace, so its Auto tile frames
    for it. The workspace's view is the one the scope keeps for it (SPECTRUM's Bode view frames as SCOPE). The web
    eye's Optimize names SCOPE, whose edge trigger its fit needs.

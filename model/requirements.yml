  - FU-DSO-SOUND
  - FU-DSO-WEBCLIENT
  verificationMethods:
  - test
  verificationCriteria: A 1 V sine on 0.5 V DC reads 707 mV RMS, 0.5 V DC, 2 Vpp and a 3.01 dB crest; the dBu, dBV
    and nominal references read 0 dB at their levels; Go and sound.js agree.

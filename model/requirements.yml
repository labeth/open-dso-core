- id: REQ-DSO-027
  title: Factory takeover policy
  text: The instrument shall gate ordinary factory takeover on an inherited GPMC descriptor and idle confirmation,
    with explicit forced-takeover and already-taken-over reclamation exceptions.
  status: implemented
  realizes:
  - CAP-DSO-SUPERVISED-OPERATION
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-AGENTTEST-AGENTTEST-GO
  - CODE-SUPERVISOR-AGENT-BOARD-GO
  - CODE-SUPERVISOR-AGENT-FAKEBOARD-TEST-GO
  - CODE-SUPERVISOR-AGENT-HANDLERS-GO
  - CODE-SUPERVISOR-AGENT-RPC-TEST-GO
  - CODE-SUPERVISOR-AGENT-TAKEOVER-GO
  - CODE-SUPERVISOR-AGENT-TAKEOVER-TEST-GO
  - CODE-SUPERVISOR-OTACTL-CLI-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  - FU-DSO-SUPERVISOR-OTACTL
  notes: Takeover serializes through tkMu. Dry-run stops after candidate discovery. With candidates present, the
    ordinary path sends STOP, attempts TRMD STOP and queries SAST diagnostically before checking factory version
    0x0052 and three equal masked fill-counter pairs 50 ms apart. With no candidates, STOP is omitted but idle is
    still checked. Force attempts the same gates and ignores their errors. State is persisted before any kill; four
    kill/rescan rounds are followed by watchdog acquisition or background retry and asynchronous network reassertion.
    Success does not require that all holders are gone, watchdog acquisition has succeeded or network restoration
    has completed. An already-taken-over call returns success and rearms watchdog acquisition. reclaimBus serializes
    with takeover but kills despite missing descriptor, STOP failure or idle-check failure. The idle deadline does
    not interrupt a blocking ioctl. A nonpositive timeout enters no polling iteration and returns nil; normal callers
    use positive timeouts. A failed persistence attempt can leave the live TakenOver flag true, causing a later
    call to take the idempotent branch. Network restoration waits 2, then 10, then 30 seconds.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run the reviewed candidate, result-summary, CIDR, idempotency, ordered happy-path, STOP
    refusal, busy-engine refusal and forced-failure tests. These use temporary files, test-created processes, fake
    register readings and a loopback VXI-11 stub. They do not qualify real GPMC timing, counter aliasing, physical
    watchdog operation, actual network restoration or factory firmware. Preserve the force/reclaim exceptions and
    successful-return limitations rather than reporting unconditional idle-before-kill safety.
- id: REQ-DSO-028
  title: Application slot supervision and recovery ladder
  text: The instrument shall select application slots, classify supervised outcomes and apply the conditional recovery
    ladder.
  status: implemented
  realizes:
  - CAP-DSO-SUPERVISED-OPERATION
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-AGENT-AGENT-GO
  - CODE-SUPERVISOR-AGENT-AGENTTEST-AGENTTEST-GO
  - CODE-SUPERVISOR-AGENT-FAKEBOARD-TEST-GO
  - CODE-SUPERVISOR-AGENT-PERF-BENCH-TEST-GO
  - CODE-SUPERVISOR-AGENT-SUPERVISE-GO
  - CODE-SUPERVISOR-AGENT-SUPERVISE-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-AGENT
  notes: 'The supervisor launches or adopts only while TakenOver and unpaused. Slot selection prefers the active
    slot, then the confirmed one. Adoption trusts a live PID without checking executable, start time or ownership;
    adopted failures and executable-start failures do not directly invoke rollback. A launched slot is confirmed
    at run end when health was observed once and StableSecs elapsed, even after stale-health termination or a nonzero
    exit. Confirmation and active-pointer write errors are ignored while success events and failure resets can still
    occur. Other launched-run failures invoke the threshold ladder: confirmed slot, otherwise continued retries.
    Agent Stop leaves a launched app running for adoption. Group termination waits are bounded and signal errors
    are ignored; adopted-PID termination does not establish final death. These behaviors do not prove continuous
    healthy operation, durable rollback or safe PID identity.'
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run the eighteen reviewed supervisor tests with temporary slots and short-lived local processes.
    Separate characterization fixtures reproduce stale/nonzero confirmation, executable-start rollback bypass and
    late control execution. Preserve their limited scope; no device launch, factory interaction or physical recovery
    is qualified.

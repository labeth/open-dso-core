  - FU-DSO-FRAMECALC
  - FU-DSO-WEBCLIENT
  notes: Source-derived contract; source presence is not evidence of a passing hardware qualification. A web page's
    decoded capture ends on the scope's run-control keys, DEFAULT SETUP and a page's Run, Run/Stop and Single, and
    by itself after 2 minutes without a client call; the LCD names it while it holds the acquisition. The registered
    matchers are the FPGA images' protocol matchers (ADR-SERIAL-HARDWARE-TRIGGER); the engine plans them from the
    request and the levels and rates it learns from the captures, and software decoding only places the trigger
    point on the match. SPI's and I2C's two lines are each sliced at the level learned on its own channel, at that
    channel's V/div and offset (ADR-LINE-LEVELS).
  verificationMethods:

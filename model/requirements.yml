- id: REQ-DSO-220
  title: Phone remote
  text: The instrument shall serve a phone remote page that changes every setting through the sheet model without
    opening a sheet on the LCD, shows only control state, keeps a change history with undo, and keeps the phone
    awake where the browser allows.
  status: implemented
  realizes:
  - CAP-DSO-WEB-UI
  category: functional
  appliesTo:
  - FU-DSO-WEBCLIENT
  - FU-DSO-WEBSERVER
  verificationMethods:
  - test
  verificationCriteria: Browser tests in phone emulation drive every tab, typed entry, workspace switching with
    an LCD sheet open, undo and the guarded Default Setup against the test server; on the device, the same flows
    from a phone with the LCD showing the REMOTE confirmations.
  notes: The workspace keys are /api/panel {"workspace"} and {"again"} (with "workspace", again runs only while
    that workspace is active), which leave an open LCD sheet as it is. The phone's keys and knobs ({"button"|"knob",
    "remote":true}) are answered once they have run and never work the LCD's menus. The menu keys and F-keys are
    refused. The S/DIV, Adjust and Position turns and the Adjust and Position pushes wait while a menu is open there.
    The Adjust push is refused where it would open one. While Autoset sweeps, every remote change (sheet sets, actions,
    presets, typed text, workspace keys, keys and knobs, from any client) is refused with the reason; only Autoset
    itself runs, to cancel the sweep. Each answer lists the rows that call changed, measured on the panel goroutine.
    An Autoset the phone starts reports its sweep's rows when it ends. The history lives in the phone's browser.
    It books only those rows as the phone's, and every other change as the scope's or another remote's. Live texts
    (a mask test's counts, COMPARE's trigger stability) stay out of the remote's Seq, and SheetsSeq moves only with
    a sheet value, so an idle phone does not poll in a loop. Rows are settings. Time/div is the timebase asked for,
    which the engine applies at its next capture, and Memory depth is the depth asked for; a call's answer stands
    only against an older read. Plain HTTP has no wake lock. The page keeps the phone awake with a muted video on
    Chromium, and with a silent sound track and the "ambient" audio session on WebKit. A Keys switch uses the sound
    track on any phone where the quiet way does not hold. Whether each way holds the screen on real phones, and
    whether music plays on, is not yet verified.

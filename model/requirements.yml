- id: REQ-DSO-284
  title: Diagnostics stick, passive stage
  text: The instrument shall, booted under the factory firmware from the diagnostics stick, record the board's kernel,
    devices, pin multiplexing, processes, factory firmware files, FPGA version register, the factory app's settings
    and its screen without writing anything but the stick.
  status: implemented
  realizes:
  - CAP-DSO-DIAGNOSTICS
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-DIAG-DIAG-GO
  - CODE-SUPERVISOR-DIAG-DIAG-TEST-GO
  - CODE-SUPERVISOR-DIAG-FIRMWARE-GO
  - CODE-SUPERVISOR-DIAG-PROCS-GO
  - CODE-SUPERVISOR-DIAG-SCREEN-GO
  - CODE-SUPERVISOR-DIAG-SYSTEM-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-DIAG
  verificationMethods:
  - test
  verificationCriteria: on an SDS1102CML+ booted cold under the factory firmware with the stick, the archive holds
    the factory app's descriptors and maps, the version register 0x0052, the factory app's identity and settings
    and its screen, with no collector errors.
  notes: Only the factory fabric's plain registers are read (version, status, fill), never a sample port. Files
    up to 1 MiB are stored whole (the factory bitstream, calibration and config), larger ones by their first 4 KiB
    with a SHA-256 of the whole.
- id: REQ-DSO-285
  title: Diagnostics stick, active stage
  text: The instrument shall, from the diagnostics stick whose MODE file says active, record the factory app's device
    syscalls while it steps the factory app through every V/div, coupling, offset, bandwidth limit, timebase, trigger
    and acquisition setting over SCPI, and then put the factory app's settings back.
  status: implemented
  realizes:
  - CAP-DSO-DIAGNOSTICS
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-DIAG-CLOCK-GO
  - CODE-SUPERVISOR-DIAG-DIAG-GO
  - CODE-SUPERVISOR-DIAG-DIAG-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-DIAG
  verificationMethods:
  - test
  verificationCriteria: on an SDS1102CML+ booted cold under the factory firmware, the trace holds the factory app's
    GPMC register reads and writes with each sweep step's time, and the settings read afterwards equal those before.
  notes: The tracer is a child process; its exit detaches and resumes the factory app's threads. No FPGA image is
    loaded and no flash is written.
- id: REQ-DSO-286
  title: Diagnostics archive
  text: The instrument shall, from the diagnostics stick, leave one archive on the stick with a manifest of every
    member, the collectors' errors and a summary, and a status file saying when it is done.
  status: implemented
  realizes:
  - CAP-DSO-DIAGNOSTICS
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-DIAG-ARCHIVE-GO
  - CODE-SUPERVISOR-DIAG-DIAG-GO
  - CODE-SUPERVISOR-DIAG-DIAG-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-DIAG
  verificationMethods:
  - test
  verificationCriteria: the archive lists every member with its size and SHA-256, a member past the size cap is
    listed as not stored while the manifest and the error list are always stored, and the status file ends with
    DONE.
- id: REQ-DSO-287
  title: Diagnostics gate before the active stage
  text: The instrument shall, from the diagnostics stick in its auto mode, run the active stage only when the passive
    stage found an AM335x running the SDS1000 factory app on /dev/Gpmc, an FPGA register read through the inherited
    descriptor, a Siglent SDS1000-series identity and settings answered in the form the sweep restores, and say
    which check failed otherwise.
  status: implemented
  realizes:
  - CAP-DSO-DIAGNOSTICS
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-DIAG-DIAG-GO
  - CODE-SUPERVISOR-DIAG-DIAG-TEST-GO
  - CODE-SUPERVISOR-DIAG-GATE-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-DIAG
  verificationMethods:
  - test
  verificationCriteria: an SDS1102CML+ as the passive stage saw it passes whatever its FPGA version; another CPU,
    no factory app, no /dev/Gpmc, an unreadable FPGA, another identity or headerless answers each stop the gate
    and are named.
- id: REQ-DSO-288
  title: Diagnostics takeover stage and ball census
  text: The instrument shall, from the diagnostics stick in its auto mode after the active stage, when the factory
    app took every step and runs on, the configuration port reads the configured fabric and the factory FPGA image
    is an EP4CE10's, stop the factory app, load the probe image without and with the weak pull-ups, and judge from
    the census of every FPGA ball which converter cores, channel front ends and clocks of the SDS1102CML+'s population
    are present, absent or partial.
  status: implemented
  realizes:
  - CAP-DSO-DIAGNOSTICS
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-DIAG-DIAG-GO
  - CODE-SUPERVISOR-DIAG-DIAG-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-DIAG
  verificationMethods:
  - test
  verificationCriteria: on an SDS1102CML+ booted cold under the factory firmware, every converter core, both front
    ends, the reference clock and the encode PLL are judged present; a modelled board without a converter pair,
    a front end or with a driven unused ball is judged so; the probe image's simulation counts a ball's edges and
    high time and keeps every leg off until turned on.
  notes: The probe image drives the ARM bus only during a read and each encode leg only when the host turns it on.
    The loads are volatile; the factory firmware comes back at the next power-on.
- id: REQ-DSO-289
  title: Diagnostics run of this firmware's app
  text: The instrument shall, from the diagnostics stick's takeover stage, run this firmware's app on the board
    for a minute and a half as the agent runs it, and record its log, whether and when it reported health, and its
    status and screen.
  status: implemented
  realizes:
  - CAP-DSO-DIAGNOSTICS
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-DIAG-APPRUN-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-DIAG
  verificationMethods:
  - test
  verificationCriteria: on an SDS1102CML+ the archive holds the app's log, its status and screen, and the summary
    says it reported health.
- id: REQ-DSO-292
  title: Diagnostics DONE screen
  text: The instrument shall, when the diagnostics stick has finished, flush the stick and show DONE, or FAILED

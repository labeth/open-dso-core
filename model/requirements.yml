  verificationCriteria: Run TestSpectrogramJS for palette stops, coarse brightness monotonicity and tone-column
    placement, plus TestSpectrogramJSBreaker for selected hostile palette/floor/spectrum inputs. Run the three spectrogram
    boundary characterizations in scripts/check_export_spectrogram.py, including a recording context for sgBlit.
    Typed-array byte validity alone is not numerical spectrum accuracy; the known axis-label defect remains open.
    TestSpectrogramBrowser supplies bounded live-browser evidence with synthetic frames. Eight isolated view-glue
    cases cover formatting, selected guards and control behavior; browser and source hashes are recorded in browser-view-test-run.json.
    Ten original LCD tests under race detector cover selected palette values, tone-column tolerances, row order,
    painted-pixel presence and no-panic paths. The 50-family breaker does not assert row advancement; the nominal
    len-17-sine degenerate case is empty and skipped. Ten overlay cases characterize floor/scale/history/constructor/row-count
    and unused-tail behavior. These do not qualify physical spectral accuracy, elapsed timing or concurrent access.
    Selected original LCD golden tests compare supplied synthetic fixtures against checked-in RGB images with a
    64-pixel tolerance; they preserve existing image defects and do not establish physical accuracy.
  notes: 'Source-derived contract. The browser waterfall scrolls RGBA rows downward, maps each column to a spectrum
    bin, uses relative dB with a negative floor and caps retained rows at the configured height. Nonpositive peak/half
    inputs leave the image unchanged; clearing retains the last Nyquist value. A reproduced axis-label defect strips
    significant trailing zeros: the 100 MHz endpoint is labeled 1M. Node helper tests do not establish WebGL rendering,
    LCD behavior or physical spectral accuracy. View glue skips unarmed, envelope, short and duplicate-sequence
    frames. Changing channels retains old rows and the last sequence; clearing does not allow the same frame to
    be repushed. A floor selection made before allocation is discarded. A real Chromium test with synthetic localhost
    frames passes accumulation, painted-pixel, enlarge, stop and clear checks; it does not test frequency labels,
    LCD behavior or physical accuracy. LCD Push paints a row for each 2048-point stretch of a record whose FFT view
    spectrum has 4096 points or more (each stretch transformed at the stride and span of that spectrum, the newest
    on top), else that spectrum as one row, and retains previous rows when channel or effective Nyquist changes.
    Clear retains scale and floor. NaN/nonnegative floor values fall back for painting without updating the displayed
    field; negative-infinite floor paints white, and nonfinite Nyquist is retained. The helper accepts repeated
    sequences, envelope-tagged frames and flat records, while the reviewed LCD loop separately gates active view,
    new sequence and non-envelope frames and selects C1. Zero-value Spectrogram requires constructor allocation.'

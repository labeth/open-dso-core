- id: REQ-DSO-126
  title: Cross-frame uniformity telemetry
  text: The instrument shall report cross-frame sample dispersion for centred and fixed-position windows.
  status: implemented
  realizes:
  - CAP-DSO-ACQUISITION
  category: functional
  sourceRefs:
  - CODE-ENGINE-MODES-GO
  - CODE-ENGINE-PERF-BENCH-TEST-GO
  appliesTo:
  - FU-DSO-ENGINE
  verificationMethods:
  - inspection

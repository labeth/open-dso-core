- id: REQ-DSO-228
  title: BUS Stream view
  text: The instrument shall, while the BUS workspace shows its Stream view, stream the bus the decoder settings
    name (in hardware, or in software for REQ-SDS-240) with the stop the BUS sheet holds and show its transcript,
    and end that stream when the view is left.
  status: implemented
  realizes:

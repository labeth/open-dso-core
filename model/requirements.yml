  notes: 'Source-derived contract for ten decoder families: UART, I2C, SPI, Manchester, SENT, CAN/CAN-FD, MIL1553,
    ARINC429, USB LS/FS and FlexRay. All eleven Go implementation files are reviewed. OK is protocol-specific and
    can coexist with error spans; callers must inspect those spans. SPI has no chip-select input and I2C has seven-bit
    address extraction. CAN-FD is base-format best-effort through data only; classic CAN does not completely validate
    delimiters/EOF. USB uses one sampled line without payload CRC or differential SE0 validation. FlexRay frame
    CRC is checked only for an exact header-implied byte length; mismatched lengths can retain header-only acceptance.
    SENT clamps malformed nibble widths before later CRC checking. Configured timing/threshold preconditions and
    auto-detection heuristics do not establish electrical or standards compliance. All eight JavaScript implementation
    scripts are reviewed and linked. JS gap sentinels, UART options, SPI default bit order and byte formatting differ
    from Go; shared implementation patterns do not prove identical behavior for every input. Browser integration
    is a separate evidence scope. Breaker test labels such as valid frame and false positive are not qualification
    claims: some fixtures share CRC helpers, omit complete trailers, permit decode failure, or assert only no panic.
    The USB tight-gap fixture merges packets, and the CRC-named fixture is accepted without an error; native passing
    status excludes those disabled assertions. Decoders run on live time-ordered envelope frames (Ordered), so a
    decoding display leases no raw frames; the decodeview web control is accepted and ignored. The LCD caches each
    decode per frame content; Auto is no decoder (REQ-SDS-222) and detects only when asked or when the bus it found
    is lost.'
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run the 33 reviewed original tests in eight ordinary decoder test files with the race detector.
    They cover selected synthetic round trips, formatting, auto-detected protocol names, parity/error spans and
    bounded seeded no-panic inputs. CRC/field fixtures sometimes reuse or mirror production helpers, limiting independence.
    Separate overlays characterize FlexRay length-dependent CRC acceptance, SENT coding-error acceptance, classic
    CAN missing trailers and CAN-FD trailer omission. Seven additional reviewed tests cover fixed-seed robustness
    (1500 sampled cases), literal truth vectors and 336 Node parity vectors. The robustness tests are ordinary tests,
    not Go fuzz targets. Parity compares OK, integer-coerced bytes and text, excluding span coordinates and most
    metadata. Literal-vector publication attribution is not independently verified. Twelve original breaker tests
    across all ten fully reviewed breaker files add bounded seeded round trips, error and timing cases. Their assertion
    limits are recorded in the word, clock and framed breaker reviews. USB known-defect assertions are disabled
    in the original suite; both fail in a separate temporary overlay and are not credited as passing verification.
    Full external-oracle qualification remains pending. Physical protocol and full standards qualification remain
    unestablished.

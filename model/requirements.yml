  - FU-DSO-SOUND
  - FU-DSO-WEBCLIENT
  - FU-DSO-WEBSERVER
  - FU-DSO-SCOPEWEB
  verificationMethods:
  - test
  verificationCriteria: The engine's trigger takes the first crossing after the arm (a mark that came with others
    placed on the first crossing of the FPGA's level), publishes the take with the trigger at the pre-trigger time
    and stops on SINGLE; STOP keeps the newest seconds; the LCD's take view scrolls, zooms and moves the trigger;
    a headless browser stops a stream into the Take view, places cursors, reads the take's pitch and plays it at
    half speed; the phone stops and plays the take; on the instrument SINGLE on a bass note's onset puts the trigger
    at the onset.

    reject a mismatch before copying, but hash and copy use separate opens without a stable source snapshot. Upload
    commits have their separate required-digest contract in REQ-SDS-106; updates can instead use an existing source
    path. Slot installation accepts arbitrary file contents, and application activation checks only that a slot
    contains a nonempty regular file, not execute permission or image validity. Temporary-file probes reproduce

  title: Screen saver
  text: The instrument shall show only a small live scope drifting over a black LCD after no input has reached the
    panel for the Screen saver time, draw the LCD black and switch its backlight off after none has for the Screen
    off time, and let a key or knob on the scope that wakes the screen do nothing else.
  status: implemented
  realizes:
  - CAP-DSO-FRONT-PANEL
  category: functional
  appliesTo:

- id: REQ-DSO-268
  title: Envelope (ADSR) capture
  text: The instrument shall, when armed, capture a note's envelope from the FPGA's edge on a gate or on the signal's
    level until the sound has died away, and read its attack (10-90 % and start to peak), decay with its time constant,
    sustain, release with its time constant and peak, from a tone's amplitude or a CV read directly.
  status: implemented
  realizes:
  - CAP-DSO-SOUND
  category: functional
  appliesTo:
  - FU-DSO-RENDER
  - FU-DSO-SOUND
  - FU-DSO-WEBCLIENT
  verificationMethods:
  - test
  verificationCriteria: Synthetic envelopes (gated and found, tone and CV, percussive) read their attack within
    5 ms, sustain within 3 %, decay and release within a few milliseconds; a gate-armed capture on the gate's marks
    reads its envelope; on the device the generator's envelope times are read.
  notes: The capture starts only on a mark the FPGA put in the stream; software places it on the crossing.
  sourceRefs:

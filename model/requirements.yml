- id: REQ-DSO-012
  title: Acquisition modes
  text: The instrument shall apply the supported averaging, enhanced-resolution and peak policies for the active
    acquisition path.
  status: implemented
  realizes:
  - CAP-DSO-ACQUISITION
  category: functional
  sourceRefs:
  - CODE-ENGINE-AVERAGE-GO
  - CODE-ENGINE-AVERAGE-TEST-GO
  - CODE-ENGINE-MODES-GO
  - CODE-ENGINE-PERF-BENCH-TEST-GO
  - CODE-ENGINE-QUALIFY-TEST-GO
  appliesTo:
  - FU-DSO-ENGINE
  notes: Source-derived contract; source presence is not evidence of a passing hardware qualification. Average is
    the mean of the captures until the count is reached, then a running average in which each capture weighs
    1/count, so every shown frame holds the full count. SINGLE in Average, Precision and ERES runs on the
    decimated capture the preview uses and stops with the completed result; a stop keeps an averaged frame.
  verificationMethods:

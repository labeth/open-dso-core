  title: The bus drawn as what it carries
  text: The instrument shall show a decoded bus in the web page's BUS Visual view as what its data means, namely
    a MIDI keyboard with a piano roll, a DMX512 universe's levels, a PS/2 keyboard's keys and typed text or a mouse's
    moves and buttons, an LED strip's colours, an IR remote's buttons, a PWM line's duty with a servo's angle, an
    encoder's or stepper's position and speed, a caliper's reading, the DCF77 time, a UART's terminal, the USB PD
    offers, request and contract, Wiegand cards, CAN signals from a DBC file and a protocol layer's values, from
    each capture's decode, or gap-free from the scope's stream for the byte-wise buses.

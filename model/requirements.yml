- id: REQ-DSO-233
  title: Pulse-coded single-wire protocol decoding
  text: The instrument shall decode 1-Wire (resets, presence, time slots in standard and overdrive speed, ROM commands
    and the ROM CRC-8), WS281x LED data (800 and 400 kbit/s), DHT11, DHT22 and AM230x readings with their checksum,
    HDMI-CEC messages with their end-of-message and acknowledge bits, and SAE J1850 VPW frames with their CRC-8.
  status: implemented

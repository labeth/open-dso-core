    256; check the reported bandwidth lies within the search bracket. This does not establish analog bandwidth or
    noise performance.
- id: REQ-DSO-100
  title: Factory instrument command transport
  text: The instrument shall provide a VXI-11 client for factory command writes and query replies used during takeover.
  status: implemented
  realizes:
  - CAP-DSO-SUPERVISED-OPERATION
  category: functional
  sourceRefs:
  - CODE-SUPERVISOR-VXI11-PERF-BENCH-TEST-GO
  - CODE-SUPERVISOR-VXI11-VXI11-GO
  - CODE-SUPERVISOR-VXI11-VXI11-TEST-GO
  appliesTo:
  - FU-DSO-SUPERVISOR-VXI11
  notes: The client resolves DEVICE_CORE through portmapper GETPORT, retries create_link three times and appends
    a newline to writes. RPC calls use AUTH_NULL and per-call deadlines. Query reassembles up to 64 read replies;
    any nonzero low-three-bit reason ends reassembly. Exhausting all 64 reads returns accumulated data without an
    explicit incomplete-response error. Send accepts a result shorter than four bytes and does not validate the
    reported write count. RPC fragments have no cumulative size bound. Verifier-length and read-payload arithmetic
    lack the server parser's overflow-safe checks. Close ignores destroy-link errors. The implementation has no
    concurrency lock; callers must serialize a client. Existing tests use a loopback fake, not factory firmware.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Exercise fake portmapper/core discovery, newline-terminated STOP writes and SAST query replies.
    Inspect retries, deadlines, framing and close behavior. The existing happy-path test does not qualify malformed
    replies, retry exhaustion, 64-read truncation, factory compatibility or physical idle takeover.
- id: REQ-DSO-101
  title: OTA JSON command envelope
  text: The instrument shall define JSON request and response envelopes for OTA command transport.
  status: implemented

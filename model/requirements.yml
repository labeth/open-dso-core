- id: REQ-DSO-269
  title: Modulation
  text: The instrument shall read a tone's tremolo depth, rate and shape, its vibrato deviation in cents and Hz,
    rate and shape, wow, flutter and a weighted wow-and-flutter figure, audio-rate FM's carrier-to-modulator ratio
    and index from its sidebands, and, without a pitch, an LFO's rate, levels, rise share and shape.
  status: implemented
  realizes:

  - CODE-MEASURE-MEASURE-TEST-GO
  - CODE-MEASURE-NTH-TEST-GO
  - CODE-MEASURE-PERF-BENCH-TEST-GO
  - CODE-MEASURE-TRACE-GO
  - CODE-MEASURE-TRACE-TEST-GO
  appliesTo:
  - FU-DSO-DSP
  - FU-DSO-MEASURE
  notes: Source-derived contract. Vrms is the AC standard deviation, not total RMS including DC. Timing requires
    at least eight ADC codes of settled amplitude and positive sample period; HasTiming needs two rising crossings,
    while isolated edge widths may still be nonzero. Q8 histogram mode lookup currently caps its upper index at
    255, causing typical Q8 settled levels to fall back to extrema and suppressing overshoot. No instrument behavior
    is repaired by this model.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Run the existing waveform, clipping, width-merge parity, finite-result, fractional precision,
    small-ripple and stored-triangle tests. The recorded triangle is fixture replay, not a new hardware run. Preserve
    the separate raw/Q8 overshoot characterization as a known discrepancy; existing test success does not establish
    Q8 settled-level equivalence or arbitrary nonfinite input handling.

  notes: Source-derived draft contract. The reviewed foundation requires a complete page-sized pixel buffer; short
    buffers can panic or produce inconsistent BMP size fields. SI labels can retain scientific notation outside
    the available prefix range. Bringup ignores GPIO write errors; OpenFB assumes fixed RGB565 geometry and 32-bit
    ARM vinfo offsets. Host rendering evidence does not establish driver compatibility, panel enable or tear-free
    output. Shared rendering, FFT, spectrogram and super-resolution display helpers are reviewed; LCD source review
    is complete at the function level; physical display qualification remains incomplete. Measurement-cache reuse
    can retain results across changed samples, precision codes and filter guard for equal sequence values. Negative
    frame validity/decoder selectors and direct zero-window masks can panic. Persistence composites only onto a
    memory canvas of the same format. The network label selects the first global-unicast IPv4 address, not a proven
    reachable endpoint. Enumeration failures cache an empty label for five seconds; typed-nil address pointers panic.
    Super-resolution review tiles the time trace but FFT resampling consumes the stored fine-grid array. Negative
    bins are interpolated for FFT; XY lifts the pen over invalid samples. Leading or trailing NaN bins can panic
    during gap filling. Review modes 3 and 4 fall back to the time trace. Bode drawing assumes aligned frequency/gain/phase
    arrays; missing arrays panic, and unused gain tail entries alter the scale. Shared palette generation sorts
    JSON token mappings into CSS and RGB literals; malformed token strings are trusted and CSS writes precede LCD-reference
    validation. The generated palette remains unmodified.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Inspect the linked surface, font, format and hardware-boundary implementation. The original
    SI-prefix boundary test contributes partial native evidence; separate overlay characterizations exercise packing,
    clipping, decay, compositing, PNG/BMP export, text placement and synthetic-memory fallback. Exercise framebuffer
    mapping, panning and GPIO behavior on identified hardware before claiming physical qualification. Run the fourteen
    original render_test.go cases with the race detector for trace/envelope/hold, menus, cursors, readout presence,
    alternate-view colors and mask/Bode presence. Their pixel-count assertions do not prove complete pixel or measurement
    accuracy. Thirteen overlay cases independently characterize cache, invalid-input and compositor behavior, isolate
    enabled-mask geometry rejection, compare 16/32-point FFTs with direct DFT, and expose flat-input peak and trailing-record
    limits. Three original network-label tests use injected enumeration and check cache behavior and text bounds;
    two overlay cases characterize typed-nil pointers and cached failure recovery. The original LCD spectrogram
    render test asserts painted pixels and empty/nil safety, not complete layout accuracy. Six original super-resolution
    tests use preconstructed synthetic means and selected color-presence assertions. Eight overlay cases characterize
    exact gap filling, half-bin resampling, NaN panics, nonfinite timing, capped undersampling, all-gap CH2 and
    fallback views. They do not exercise acquisition reconstruction or establish physical display accuracy. Thirteen
    checked-in golden comparisons permit 64 differing RGB pixels and ignore alpha. Visual inspection retains top-bar
    collisions in Bode/spectrogram and crowded FFT labels. Two inversion tests assert selected trace/envelope rows.
    TestRenderFuzzNoPanic is a fixed-seed ordinary test of 400 cases, excluding negative validity/selectors and
    nonfinite means; it is not exhaustive fuzzing. Seven Bode overlay cases check selected log-axis centers and
    malformed-array/range behavior. Original palette parity compares parsed literals to JSON; isolated regeneration
    checks generated artifacts without rewriting the originals.

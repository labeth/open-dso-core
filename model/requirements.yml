- id: REQ-DSO-014
  title: Zone and mask gates
  text: The instrument shall evaluate configured zones and golden masks against captured samples.
  status: implemented
  realizes:
  - CAP-DSO-TRIGGER
  category: functional
  sourceRefs:
  - CODE-RENDER-RENDER-INVS-TEST-GO
  - CODE-WEBCLIENT-APP-ZONEMASK-JS
  - CODE-WEBCLIENT-MASK-BUILD-TEST-CJS
  - CODE-WEBCLIENT-WSMATH-JS
  - CODE-WEBSERVER-WEBTEST-FAKE-GO
  appliesTo:
  - FU-DSO-RENDER
  - FU-DSO-WEBCLIENT
  - FU-DSO-WEBSERVER
  notes: Source-derived contract; source presence is not evidence of a passing hardware qualification. Browser configuration
    draws edge-relative zones, builds dilated masks from distinct raw frames and reanchors code bounds to stored
    voltage context. Zone coordinates and overlay transforms use C1 even for selected C2. Upload errors are not
    acknowledged in the local success state; mask frame eligibility and calibration identity are weaker than panel-side
    checks. The zone trigger is evaluated by the qualifier FPGA image (ADR-HARDWARE-QUALIFIERS; four zones, bucketed
    windows around the edge); masks are still tested in software on triggered frames, which is a pass/fail test
    of a capture, not a trigger. A mask tests every triggered frame of its timebase - a frame sampled otherwise
    than the frames it was built from (a full-rate record while a view holds a lease, the live envelope after one)
    is read through trigger-relative time, on the LCD overlay as in the test; a frame of another timebase or window
    span is skipped and counted as skipped.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Inspect the linked implementation and run the corresponding offline tests; hardware claims
    require independently identified device evidence. See reconstruction-mask-ui-source-review.json; isolated controller
    checks and publication integration are tracked separately from source inspection.
- id: REQ-DSO-017
  title: Measurements
  text: The instrument shall compute voltage and timing measurements from the shared measurement core.
  status: implemented
  realizes:
  - CAP-DSO-MEASUREMENT
  category: functional
  sourceRefs:
  - CODE-DSP-MINMAX-ARM-GO
  - CODE-DSP-MINMAX-GENERIC-GO
  - CODE-DSP-MINMAX-GO
  - CODE-DSP-PRECISION-TEST-GO

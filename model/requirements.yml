  notes: 'Source-derived contract; source presence is not evidence of a passing hardware qualification. Browser
    ETS folds samples against a single-bin fundamental phase and derives noise reduction from odd/even half-stack
    differences. It assumes valid raw samples; negative companion codes are accumulated rather than masked. Short
    companion channels are skipped and longer companions are folded in full. Refined frequency is assigned by callers;
    stored fSum/fN are not updated by feed. Synthetic reconstruction and noise rejection checks do not establish
    SINAD ENOB or physical timing accuracy. Browser stack reconstruction also supports automatic-reference correlation
    and locked-reference gated matching, linear or cubic interpolation and weighted sample deposition. Matching
    and noise estimates are heuristic: local maxima are selected in location order, repeated decoded centers can
    duplicate a hit, and insufficient or zero half-stack estimates can fall back to theoretical noise. Interpolation
    and a finer output grid do not establish recovered analog bandwidth. See superres-core-source-review.json for
    source-specific assumptions and limits. Original pinned browser core suite passes 72 assertions. The full adversarial
    corpus passes 194 of 200 cases: five mean-fidelity failures (families/gates 1/half, 1/triple, 6/triple, 22/half,
    36/half) and one false acceptance (31/junk). These six failures remain failed evidence, not waivers or passing
    qualification. Browser capture controls select ordinary, ETS or UART-event stacking and synthesize review frames.
    Ordinary stacking guards length, sample period and volts/code changes; ETS and event paths only compare sample
    period. Stop-target cadence, auto-frequency assumptions and optimistic hardware commands are documented in reconstruction-mask-ui-source-review.json.'

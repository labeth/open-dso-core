- id: REQ-DSO-272
  title: Pitch-locked cycle on the FPGA's edge
  text: The instrument shall draw one, two or four periods of the tuned channel from a level crossing the FPGA marked
    in the stream, placed on that crossing between samples, with the previous cycles fading behind, and read the
    period, duty, peak-to-peak, rise, fall and slew.
  status: implemented
  realizes:
  - CAP-DSO-SOUND
  category: functional
  appliesTo:
  - FU-DSO-RENDER
  - FU-DSO-SOUND
  - FU-DSO-WEBCLIENT
  - FU-DSO-WEBSERVER
  verificationMethods:
  - test
  verificationCriteria: A mark is placed on its sine crossing within 0.01 samples and a mark with no crossing beside
    it is dropped; the mark registers read back as the image holds them; on the device the trace holds still on
    a tone.
  notes: The FPGA decides every trigger; software only places the mark on its crossing (the mark level follows the
    signal's centre as autoset places a trigger level).

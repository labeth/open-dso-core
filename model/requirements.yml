  - test
  verificationCriteria: Check exact golden request/response encodings, error responses retaining data, 23 sample
    command round trips and literal agent response shapes. Run the 15 request and 11 response fuzz seeds as bounded
    corpus checks. Stable re-encoding does not prove preservation of arbitrary numeric precision or handler behavior.

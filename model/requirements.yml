    state, channel changes, accepted-evaluation sequence, curve capacity, detached returns and raw-code gain. The
    50-family breaker applies four DUT relationships but does not assert every advertised degenerate-input rejection.
    Inspect the legacy lock/observe/arm gate and separate SRAM dispatch. Tests call the evaluator directly and do
    not establish acquisition-path integration, calibrated volts gain or physical sweep accuracy.
  notes: Source-derived measurement contract. Fundamental frequency uses mean crossings with two-code hysteresis;
    a mean-subtracted single-bin DFT gives raw ADC-code magnitude ratio and phase. At least four cycles, below Nyquist
    and a reference DFT above the record-scaled floor are required. Per-channel voltage scales are not applied.
    Log-frequency bins use 30 bins/decade with a 4096-bin cap; existing bins and the live point still update at
    capacity. Channel changes retain old bins/live state, and early invalid-length/sample-interval returns retain
    the previous live point. Clear resets bins/live validity but not the accepted-evaluation ordinal; Seq is not
    copied from the frame. The sole production evaluator call is gated in legacy oneFrame; Run dispatches SRAM configurations
    to runSRAM, whose reviewed body has no Bode accumulation call. SRAM integration is missing in this source snapshot.
    Rendering and controls are modeled separately by REQ-SDS-125; no hardware qualification is claimed.

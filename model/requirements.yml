- id: REQ-DSO-223
  title: AUTO in BUS frames the bus for reading
  text: The instrument shall, when AUTO is pressed in the BUS workspace, forget the bus decoded, fit the vertical with
    the threshold midway, detect the bus again and fill in the decoder settings, and put the hardware trigger on the
    start of the bus's frames with a timebase that shows whole messages with every bit resolved.
  status: implemented
  realizes:
  - CAP-DSO-PROTOCOL-DECODE
  category: functional
  sourceRefs:
  - CODE-ENGINE-SERIAL-LEVELS-GO
  - CODE-ENGINE-SERIAL-SEQUENCE-TEST-GO
  - CODE-ENGINE-SERIALTRIG-GO
  appliesTo:
  - FU-DSO-ENGINE
  verificationMethods:
  - test
  verificationCriteria: Panel tests check that AUTO in BUS scans anew (a bus set by hand is replaced by the bus on the
    inputs), frames it (the trigger near the left, the UART idle qualifier between a message's longest high time and
    its idle), that AUTO elsewhere stays the autoset, the frame-start match of each bus and that a match the user set
    wins. Engine tests check the frame-start and MIL-1553 command elements of the sequence trigger. On the device,
    AUTO in BUS on every bench bus names it, triggers in hardware on its frame starts and re-detects a moved source.
  notes: The FPGA decides the trigger (ADR-SERIAL-HARDWARE-TRIGGER). I2C uses its own matcher with no bytes (the
    address byte after every START); SPI, Manchester, SENT, CAN, USB and FlexRay the sequence trigger on START then any
    unit; ARINC 429 any word (each is a frame); MIL-1553 a command word; UART, whose matcher fires on every character,
    the pulse qualifier on an idle longer than any high time inside a message. BUS entry's detection sets the same
    trigger. AUTO in the other workspaces is the autoset framed for the workspace (REQ-SDS-224).
- id: REQ-DSO-231
  title: Converters brought up and checked after every image load
  text: The instrument shall, after every configuration of the acquisition FPGA (at start and after every image
    load), restart the converters' encode clocks and check that every converter core converts, check again every
    minute while acquiring and on a full-rate record with a held core, bring cores that hold one code under a moving
    input back by restarting the encode clocks and then by loading the image again, and show a notice and a status
    flag naming the converters that stay stuck.
  status: implemented
  realizes:
  - CAP-DSO-ACQUISITION
  category: functional
  sourceRefs:
  - CODE-ENGINE-PERF-BENCH-TEST-GO
  appliesTo:
  - FU-DSO-ENGINE
  verificationMethods:
  - test
  verificationCriteria: Snapshots of a moving input with held cores find exactly the held cores, and a quiet, flat,
    clipped or slow input finds none; an image load is followed by an encode restart and a check, then for stuck
    cores by another encode restart and a check and then reloads with an encode restart and a check each, stopping
    at the first healthy check; cores still stuck set the notice until a later check finds them converting, and a
    full-rate record with a held core brings the next check forward. On the device, a loop of image switches leaves
    no capture with stuck cores, and an encode stopped by hand is found and restarted within a second.
  notes: About one configuration in a hundred left some converters' cores holding a code while the other cores
    follow the signal, a pattern at a fifth of the sample rate under every capture; the encode clocks start with the
    configuration as its PLL locks, and stopping and starting them again (register 15) brought the converters back,
    as another configuration did. A held core is told from a live one only while the input moves (a snapshot of the
    ten cores at 64 instants, three codes off a core's median in an eighth of them); 64 snapshots take about 80 to
    130 ms of bus reads, so between checks the full-rate records' own samples are looked at once a second.

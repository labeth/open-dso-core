- id: REQ-DSO-241
  title: Bus layers
  text: The instrument shall read the packets of a decoded SPI, I2C, UART, 1-Wire, MDIO or USB bus as the transactions
    of the chip or protocol layer chosen for that bus, and name each transaction in the BUS packet list, the decode
    strip and the web page's packet table.
  status: implemented
  realizes:
  - CAP-DSO-BUS-ANALYSIS
  category: functional
  appliesTo:
  - FU-DSO-ANALYSIS
  - FU-DSO-FRAMECALC
  - FU-DSO-RENDER
  - FU-DSO-WEBCLIENT
  verificationMethods:
  - test
  verificationCriteria: Each layer's curated records read to the notes held in the golden file; the web page's twin
    writes the same notes for those records and for seeded random ones, and lists the same layers in the same order;
    the BUS sheet's Layer row offers a protocol's layers only, a restart keeps the layer and a protocol change drops
    it; with a layer the packet list writes one note a packet and the strip captions the packets.
  notes: The scope holds an SPI bus's clock and one data line, without its chip select. A transaction is a packet,
    the burst of bytes the clock's pause of 1.5 byte times ends, and each SPI layer reads the line it names (MOSI
    for the commands a host sends, MISO for the converters and pads that only answer); a read's data on the other
    line is counted, not shown. A master that pauses inside a transaction splits it.

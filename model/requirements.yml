- id: REQ-DSO-001
  title: Single bus owner
  text: The instrument shall serialize acquisition and staged GPMC operations through one engine owner.
  status: implemented
  derived: true
  derivedRationale: 'Design constraint from the bus hazard (RISK-BUS, CTRL-BUS): overlapping GPMC transactions stall
    the processor, so one owner serializes them. It serves every capability that touches the FPGA rather than one
    of them.'
  category: functional
  sourceRefs:
  - CODE-ENGINE-OWNER-JOB-GO
  appliesTo:
  - FU-DSO-ENGINE
  notes: Source-derived contract; source presence is not evidence of a passing hardware qualification.
  verificationMethods:
  - inspection
  - test
  verificationCriteria: Inspect the linked implementation and run the corresponding offline tests; hardware claims
    require independently identified device evidence.

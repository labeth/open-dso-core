  - FU-DSO-SOUND
  - FU-DSO-WEBCLIENT
  verificationMethods:
  - test
  verificationCriteria: A 30 % 5 Hz tremolo reads within 1 % and 0.05 Hz; a +-20 cent 6 Hz vibrato on a square within
    a cent; FM at index 0.6 to 3.2 within 0.1; triangle, ramp and square LFOs by rate and shape; Go and sound.js
    agree; on the device the generator's rates and depths are read.

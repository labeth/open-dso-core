    The isolated activation probe confirms omitted-digest acceptance, arbitrary contents and activation without
    execute bits; the agent exit is captured by a test hook. These results characterize current behavior and do
    not qualify boot rollback, actual agent respawn, image validity, concurrent source mutation or physical operation.

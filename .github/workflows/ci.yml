name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # golangci-lint with the repository's .golangci.yml (the linters, their
  # thresholds and each exception's reason live there), the same file and
  # version as the scope repositories'. supervisor is its own module and
  # requires the root one through its go.mod replace.
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", supervisor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}

  # The browser demo: the WebAssembly engine and the static site build from
  # the core's test scope (simdemo/testdata). Each scope's own CI builds its
  # site with `make demo`; publishing is not this job's.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: build the WebAssembly demo
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/dsodemo-wasm
      - name: build the demo site
        run: |
          go run ./cmd/dsodemo-site -profile simdemo/testdata/profile.yaml -demo simdemo/testdata/demo.json -out build/demo
          ls -l build/demo/dsodemo.wasm
          echo "gzipped: $(gzip -9 -c build/demo/dsodemo.wasm | wc -c) bytes"
      - name: test the simulated board, the generator and the demo
        run: go test -short ./hal/simboard/... ./siggen/... ./simdemo/...

  # The recorded sessions (session/sessions) against the native and the
  # WebAssembly demo of the core's test scope, and their diff: the same
  # composition in two hosts must answer the same. The diff is the job's
  # artifact; a field that differs fails it.
  sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PW_VERSION: 1.58.2 # pin: the scope repositories' browser lane uses the same
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.PW_VERSION }}
      - name: Install Playwright + Chromium
        timeout-minutes: 10
        run: |
          mkdir -p "$HOME/pw" && cd "$HOME/pw"
          npm init -y >/dev/null
          npm install "playwright@${PW_VERSION}"
          # the OS libraries through apt without prompts; the browser from the cache when present
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive npx playwright install-deps chromium
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium
          fi
          echo "PLAYWRIGHT_DIR=$HOME/pw/node_modules" >> "$GITHUB_ENV"
      - name: the session harness and its set
        run: go test ./session/...
      - name: native and WebAssembly demo, and their diff
        run: make sessions TARGET=pair ARGS=-fail-on-diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sessions
          path: build/sessions/
